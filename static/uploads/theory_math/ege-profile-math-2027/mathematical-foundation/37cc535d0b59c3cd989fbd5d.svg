<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="900" height="355" viewBox="0 0 900 355"><ns0:rect x="0" y="0" width="900" height="355" rx="24" fill="#F7F9FE" stroke="#F7F9FE" stroke-width="0" /><ns0:text x="33" y="43" fill="#20304E" font-family="Arial,sans-serif" font-size="22" text-anchor="start">Почему работает признак делимости на 9</ns0:text><ns0:rect x="48" y="78" width="805" height="245" rx="15" fill="#FFFFFF" stroke="#BAC6D9" stroke-width="1.5" /><ns0:rect x="80" y="125" width="170" height="92" rx="15" fill="#E8ECFF" stroke="#BAC6D9" stroke-width="1.5" /><ns0:text x="165" y="159" fill="#20304E" font-family="Arial,sans-serif" font-size="26" text-anchor="middle">10⁰</ns0:text><ns0:text x="165" y="191" fill="#63748F" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Единицы</ns0:text><ns0:text x="165" y="251" fill="#586BF0" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">≡ 1 (mod 9)</ns0:text><ns0:rect x="282" y="125" width="170" height="92" rx="15" fill="#E5F7F2" stroke="#BAC6D9" stroke-width="1.5" /><ns0:text x="367" y="159" fill="#20304E" font-family="Arial,sans-serif" font-size="26" text-anchor="middle">10¹</ns0:text><ns0:text x="367" y="191" fill="#63748F" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Десятки</ns0:text><ns0:text x="367" y="251" fill="#586BF0" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">≡ 1 (mod 9)</ns0:text><ns0:rect x="484" y="125" width="170" height="92" rx="15" fill="#E8ECFF" stroke="#BAC6D9" stroke-width="1.5" /><ns0:text x="569" y="159" fill="#20304E" font-family="Arial,sans-serif" font-size="26" text-anchor="middle">10²</ns0:text><ns0:text x="569" y="191" fill="#63748F" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Сотни</ns0:text><ns0:text x="569" y="251" fill="#586BF0" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">≡ 1 (mod 9)</ns0:text><ns0:rect x="686" y="125" width="170" height="92" rx="15" fill="#E5F7F2" stroke="#BAC6D9" stroke-width="1.5" /><ns0:text x="771" y="159" fill="#20304E" font-family="Arial,sans-serif" font-size="26" text-anchor="middle">10³</ns0:text><ns0:text x="771" y="191" fill="#63748F" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Тысячи</ns0:text><ns0:text x="771" y="251" fill="#586BF0" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">≡ 1 (mod 9)</ns0:text><ns0:text x="450" y="292" fill="#20304E" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">Остаток числа по 9 совпадает с остатком суммы цифр</ns0:text></ns0:svg>