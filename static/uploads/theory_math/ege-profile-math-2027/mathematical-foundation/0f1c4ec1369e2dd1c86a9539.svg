<ns0:text x="32" y="40" fill="#243251" font-size="22" font-family="Arial, sans-serif">Деление дробей: сколько восьмых в трёх четвертях?</ns0:text>
<ns0:rect x="95" y="126" width="83" height="85" rx="5" fill="#17A398" stroke="#526789" stroke-width="2" />
<ns0:rect x="182" y="126" width="83" height="85" rx="5" fill="#17A398" stroke="#526789" stroke-width="2" />
<ns0:rect x="269" y="126" width="83" height="85" rx="5" fill="#17A398" stroke="#526789" stroke-width="2" />
<ns0:rect x="356" y="126" width="83" height="85" rx="5" fill="#17A398" stroke="#526789" stroke-width="2" />
<ns0:rect x="443" y="126" width="83" height="85" rx="5" fill="#17A398" stroke="#526789" stroke-width="2" />
<ns0:rect x="530" y="126" width="83" height="85" rx="5" fill="#17A398" stroke="#526789" stroke-width="2" />
