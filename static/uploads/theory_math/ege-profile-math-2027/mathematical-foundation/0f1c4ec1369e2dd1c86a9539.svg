<ns0:rect x="704" y="126" width="83" height="85" rx="5" fill="#FFFFFF" stroke="#526789" stroke-width="2" />
<ns0:text x="450" y="109" font-size="24" fill="#243251" font-family="Arial, sans-serif" text-anchor="middle">3/4 = 6/8</ns0:text>
<ns0:text x="450" y="262" font-size="29" fill="#587DF7" font-family="Arial, sans-serif" text-anchor="middle">(3/4) : (1/8) = 6</ns0:text>
<ns0:text x="450" y="318" font-size="16" fill="#64748b" font-family="Arial, sans-serif" text-anchor="middle">В шести закрашенных восьмых помещается шесть частей по 1/8.</ns0:text>
