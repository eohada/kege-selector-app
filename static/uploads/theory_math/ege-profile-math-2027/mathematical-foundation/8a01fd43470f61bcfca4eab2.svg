<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="900" height="385" viewBox="0 0 900 385"><ns0:rect x="0" y="0" width="900" height="385" rx="24" fill="#F7F9FE" stroke="#F7F9FE" stroke-width="0" /><ns0:text x="33" y="43" fill="#20304E" font-family="Arial,sans-serif" font-size="22" text-anchor="start">Сокращение не возвращает запрещённую точку</ns0:text><ns0:rect x="48" y="80" width="804" height="262" rx="15" fill="#FFFFFF" stroke="#BAC6D9" stroke-width="1.5" /><ns0:text x="90" y="130" fill="#586BF0" font-family="Arial,sans-serif" font-size="20" text-anchor="start">Исходная дробь</ns0:text><ns0:text x="90" y="167" fill="#20304E" font-family="Arial,sans-serif" font-size="24" text-anchor="start">(x² − 9)/(x − 3)</ns0:text><ns0:text x="90" y="210" fill="#E96970" font-family="Arial,sans-serif" font-size="21" text-anchor="start">x ≠ 3</ns0:text><ns0:path d="M 400 165 L 490 165 M 476 154 L 490 165 L 476 176" stroke="#586BF0" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><ns0:text x="530" y="130" fill="#0C9C8D" font-family="Arial,sans-serif" font-size="20" text-anchor="start">После сокращения</ns0:text><ns0:text x="530" y="167" fill="#20304E" font-family="Arial,sans-serif" font-size="27" text-anchor="start">x + 3</ns0:text><ns0:text x="530" y="210" fill="#E96970" font-family="Arial,sans-serif" font-size="21" text-anchor="start">при x ≠ 3</ns0:text><ns0:text x="450" y="290" fill="#20304E" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">Ограничение сохраняется после упрощения</ns0:text></ns0:svg>