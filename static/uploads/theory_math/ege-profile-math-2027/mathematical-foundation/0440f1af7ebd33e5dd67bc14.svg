<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"><ns0:rect x="0" y="0" width="900" height="380" rx="24" fill="#F7F9FE" stroke="#F7F9FE" stroke-width="0" /><ns0:text x="33" y="43" fill="#20304E" font-family="Arial,sans-serif" font-size="22" text-anchor="start">Какие одночлены можно привести?</ns0:text><ns0:rect x="53" y="79" width="795" height="262" rx="15" fill="#FFFFFF" stroke="#BAC6D9" stroke-width="1.5" /><ns0:rect x="75" y="117" width="225" height="150" rx="15" fill="#E8ECFF" stroke="#BAC6D9" stroke-width="1.5" /><ns0:text x="187" y="165" fill="#20304E" font-family="Arial,sans-serif" font-size="28" text-anchor="middle">4x²y</ns0:text><ns0:text x="187" y="202" fill="#63748F" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">Одночлен</ns0:text><ns0:rect x="330" y="117" width="225" height="150" rx="15" fill="#E5F7F2" stroke="#BAC6D9" stroke-width="1.5" /><ns0:text x="442" y="165" fill="#20304E" font-family="Arial,sans-serif" font-size="28" text-anchor="middle">−7x²y</ns0:text><ns0:text x="442" y="202" fill="#63748F" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">Подобный ему</ns0:text><ns0:rect x="585" y="117" width="225" height="150" rx="15" fill="#FFF3D9" stroke="#BAC6D9" stroke-width="1.5" /><ns0:text x="697" y="165" fill="#20304E" font-family="Arial,sans-serif" font-size="28" text-anchor="middle">3xy²</ns0:text><ns0:text x="697" y="202" fill="#63748F" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">Не подобный</ns0:text><ns0:text x="450" y="314" fill="#20304E" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">Подобные одночлены имеют одинаковую буквенную часть</ns0:text></ns0:svg>