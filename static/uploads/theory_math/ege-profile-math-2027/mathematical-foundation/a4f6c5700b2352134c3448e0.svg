<ns0:text x="700" y="98" font-size="18" fill="#243251" font-family="Arial, sans-serif" text-anchor="middle">После −25%</ns0:text>
<ns0:rect x="630" y="137" width="160" height="140" rx="10" fill="#FFFFFF" stroke="#D1DBEA" stroke-width="1" />
