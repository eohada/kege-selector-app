<ns0:text x="32" y="40" fill="#243251" font-size="22" font-family="Arial, sans-serif">Процентные изменения применяются последовательно</ns0:text>
<ns0:text x="180" y="98" font-size="18" fill="#243251" font-family="Arial, sans-serif" text-anchor="middle">Исходно</ns0:text>
