# Nginx vhost template for BooStudy blue-green deploys.
#
# The deploy script writes one directive into:
#   /etc/nginx/snippets/boostudy-active-upstream.conf
# Example content:
#   proxy_pass http://127.0.0.1:8001;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name boostudy.ru www.boostudy.ru;

    # Images are normalized in the browser before upload; do not reject the original
    # selection at the proxy level so profile media can be replaced reliably.
    client_max_body_size 0;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;

        include /etc/nginx/snippets/boostudy-active-upstream.conf;
    }
}

