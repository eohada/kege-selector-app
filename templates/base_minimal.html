<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>{% block title %}BooStudy{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='icons/BooStudyLogo1-Photoroom.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/boostudy.css') }}?v=20260708-v1">
    {% block head_css %}{% endblock %}
    {% if csrf_token %}
    <meta name="csrf-token" content="{{ csrf_token() }}">
    {% endif %}
    <style>
        :root, html, body {
            color-scheme: light !important;
            background-color: #F8FAFC !important;
            color: #0F172A !important;
        }
        input, select, textarea {
            color-scheme: light !important;
            color: #0F172A !important;
            background-color: #F4F7FA !important;
            -webkit-text-fill-color: #0F172A !important;
        }
        input:focus, select:focus, textarea:focus {
            background-color: #FFFFFF !important;
            color: #0F172A !important;
            -webkit-text-fill-color: #0F172A !important;
        }
        input::placeholder {
            color: #94A3B8 !important;
            -webkit-text-fill-color: #94A3B8 !important;
        }
        select option {
            background-color: #FFFFFF !important;
            color: #0F172A !important;
        }
    </style>
    <script>
        document.documentElement.setAttribute('data-theme', 'light');
    </script>
    {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block body %}
    <div class="min-h-screen flex items-center justify-center p-6">
        {% block content %}{% endblock %}
    </div>
    {% endblock %}

    <script src="{{ url_for('static', filename='toast.js') }}"></script>

    {% include 'sandbox/components/_feedback_system.html' %}

    {% block scripts_extra %}{% endblock %}
</body>
</html>
