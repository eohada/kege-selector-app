<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Приглашение | BooStudy</title></head><body class="min-h-screen bg-[#F8FAFC] px-4 py-12 text-slate-900"><main class="mx-auto max-w-lg"><div class="rounded-[2rem] border-2 border-slate-200 bg-white p-7 shadow-[0_4px_0_#DAE1E9] sm:p-9"><div class="mb-7 flex items-center gap-3"><div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-indigo-600 text-2xl text-white">⌁</div><div><p class="text-xs font-black uppercase tracking-[.16em] text-indigo-500">BooStudy</p><h1 class="text-2xl font-black">Приглашение на платформу</h1></div></div>{% if invite %}<p class="mb-6 rounded-2xl bg-indigo-50 p-4 text-sm text-indigo-900">Для вас подготовлено приглашение с ролью <b>{{ invite.role }}</b>. Придумайте данные для входа.</p><form method="post" class="space-y-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="block text-sm font-bold">Логин<input required name="username" maxlength="80" value="{{ invite.email or '' }}" class="mt-2 w-full rounded-xl border-2 border-slate-200 px-4 py-3 outline-none focus:border-indigo-400"></label><label class="block text-sm font-bold">Пароль<input required type="password" name="password" minlength="8" class="mt-2 w-full rounded-xl border-2 border-slate-200 px-4 py-3 outline-none focus:border-indigo-400"></label><label class="block text-sm font-bold">Повторите пароль<input required type="password" name="password2" minlength="8" class="mt-2 w-full rounded-xl border-2 border-slate-200 px-4 py-3 outline-none focus:border-indigo-400"></label><button class="w-full rounded-xl border-b-4 border-indigo-800 bg-indigo-600 py-3 font-black text-white">Создать аккаунт</button></form>{% else %}<p class="rounded-2xl bg-rose-50 p-4 text-rose-700">Ссылка недействительна или срок её действия истёк.</p><a class="mt-6 inline-flex rounded-xl border-b-4 border-slate-300 bg-slate-100 px-4 py-3 font-bold" href="{{ url_for('auth.login') }}">Ко входу</a>{% endif %}</div></main></body></html>
