{% if (is_demo_user is defined and is_demo_user) or (current_user is defined and current_user.is_authenticated and current_user.is_demo_user) %}
<!-- BooStudy Demo Experience Companion Component -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/demo/demo_companion.css') }}?v=23">
<link rel="stylesheet" href="{{ url_for('static', filename='css/demo/demo_cinematic_overrides.css') }}?v=16">

<div id="boo-companion-root"></div>

<script src="{{ url_for('static', filename='js/demo/demo_engine.js') }}?v=25"></script>
<script src="{{ url_for('static', filename='js/demo/demo_scenario.js') }}?v=24"></script>
<script src="{{ url_for('static', filename='js/demo/boo_companion.js') }}?v=68"></script>

<script>
(function() {
  function initBooDemo() {
    if (!window.BooDemoEngine || !window.BooDemoScenario || !window.BooCompanion) return;

    fetch('/demo/api/state', {
      headers: {
        'Accept': 'application/json',
        'X-Requested-With': 'XMLHttpRequest'
      }
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      var serverState = (res && res.success) ? res.state : null;
      window.BooDemoEngine.init(serverState);
      window.BooCompanion.init(window.BooDemoEngine, window.BooDemoScenario);
    })
    .catch(function(err) {
      console.warn('[BooCompanion] Fallback to local state init:', err);
      window.BooDemoEngine.init({});
      window.BooCompanion.init(window.BooDemoEngine, window.BooDemoScenario);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initBooDemo);
  } else {
    initBooDemo();
  }
})();
</script>
{% endif %}
