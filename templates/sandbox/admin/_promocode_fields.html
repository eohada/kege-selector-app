{% set value = editing_promo if editing_promo is defined else none %}
<div class="grid sm:grid-cols-2 gap-3">
  <label class="sm:col-span-2 text-xs font-black text-slate-700">Код<input required name="code" value="{{ value.code if value else '' }}" placeholder="SUMMER_2026" class="mt-1.5 w-full rounded-xl border-2 border-slate-200 bg-white px-3 py-2.5 font-bold uppercase outline-none focus:border-rose-400"></label>
  <label class="text-xs font-black text-slate-700">Скидка, %<input name="discount_percent" type="number" min="0" max="100" value="{{ value.discount_percent if value and value.discount_percent is not none else '' }}" class="mt-1.5 w-full rounded-xl border-2 border-slate-200 bg-white px-3 py-2.5 font-bold"></label>
  <label class="text-xs font-black text-slate-700">Скидка, ₽<input name="discount_rub" type="number" min="0" value="{{ value.discount_rub if value and value.discount_rub is not none else '' }}" class="mt-1.5 w-full rounded-xl border-2 border-slate-200 bg-white px-3 py-2.5 font-bold"></label>
  <label class="text-xs font-black text-slate-700">Бонус-уроки<input name="bonus_lessons" type="number" min="0" value="{{ value.bonus_lessons if value and value.bonus_lessons is not none else '' }}" class="mt-1.5 w-full rounded-xl border-2 border-slate-200 bg-white px-3 py-2.5 font-bold"></label>
  <label class="text-xs font-black text-slate-700">Бонус-дни<input name="bonus_days" type="number" min="0" value="{{ value.bonus_days if value and value.bonus_days is not none else '' }}" class="mt-1.5 w-full rounded-xl border-2 border-slate-200 bg-white px-3 py-2.5 font-bold"></label>
  <label class="sm:col-span-2 text-xs font-black text-slate-700">Только для тарифа<select name="plan_id" class="mt-1.5 w-full rounded-xl border-2 border-slate-200 bg-white px-3 py-2.5 font-bold"><option value="">Любой тариф</option>{% for plan in plans %}<option value="{{ plan.plan_id }}" {% if value and value.plan_id == plan.plan_id %}selected{% endif %}>{{ plan.title }}{% if not plan.is_active %} (выключен){% endif %}</option>{% endfor %}</select></label>
  <label class="text-xs font-black text-slate-700">Лимит активаций<input name="usage_limit" type="number" min="1" value="{{ value.usage_limit if value and value.usage_limit is not none else '' }}" placeholder="Без лимита" class="mt-1.5 w-full rounded-xl border-2 border-slate-200 bg-white px-3 py-2.5 font-bold"></label>
  <label class="flex items-end gap-2 pb-2 text-xs font-black text-slate-700"><input name="is_active" type="checkbox" {% if not value or value.is_active %}checked{% endif %}> Активен</label>
  <label class="text-xs font-black text-slate-700">Начало<input name="starts_at" type="datetime-local" value="{{ value.starts_at.strftime('%Y-%m-%dT%H:%M') if value and value.starts_at else '' }}" class="mt-1.5 w-full rounded-xl border-2 border-slate-200 bg-white px-3 py-2.5 font-bold"></label>
  <label class="text-xs font-black text-slate-700">Окончание<input name="expires_at" type="datetime-local" value="{{ value.expires_at.strftime('%Y-%m-%dT%H:%M') if value and value.expires_at else '' }}" class="mt-1.5 w-full rounded-xl border-2 border-slate-200 bg-white px-3 py-2.5 font-bold"></label>
  <label class="sm:col-span-2 text-xs font-black text-slate-700">Заметка<textarea name="note" rows="2" class="mt-1.5 w-full rounded-xl border-2 border-slate-200 bg-white px-3 py-2.5 font-medium">{{ value.note if value and value.note else '' }}</textarea></label>
</div>
