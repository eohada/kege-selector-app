{% extends 'base.html' %}
{% block title %}Редактировать тестировщика · Админ-панель{% endblock %}

{% set active_page = 'admin' %}

{% block content %}
<section class="glass-panel max-w-[800px] mx-auto">
    <h1 class="mb-4">Редактировать тестировщика</h1>

    <form method="POST" class="flex flex-col gap-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="neo-field">
            <label class="neo-label">ID тестировщика</label>
            <input type="text" value="{{ tester.tester_id }}" disabled class="neo-input bg-bg-app">
        </div>

        <div class="neo-field">
            <label class="neo-label" for="name">Имя *</label>
            <input type="text" id="name" name="name" value="{{ tester.name }}" required class="neo-input">
        </div>

        <div class="neo-field">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" name="is_active" {% if tester.is_active %}checked{% endif %}>
                <span class="neo-label m-0">Активен</span>
            </label>
        </div>

        <div class="neo-field">
            <label class="neo-label">Первое появление</label>
            <input type="text" value="{{ tester.first_seen.strftime('%d.%m.%Y %H:%M:%S') if tester.first_seen else '-' }}" disabled class="neo-input bg-bg-app">
        </div>

        <div class="neo-field">
            <label class="neo-label">Последнее появление</label>
            <input type="text" value="{{ tester.last_seen.strftime('%d.%m.%Y %H:%M:%S') if tester.last_seen else '-' }}" disabled class="neo-input bg-bg-app">
        </div>

        <div class="neo-field">
            <label class="neo-label">IP адрес</label>
            <input type="text" value="{{ tester.ip_address or '-' }}" disabled class="neo-input bg-bg-app">
        </div>

        <div class="flex gap-4 mt-4">
            <button type="submit" class="neo-button accent">{{ ui_icon('action.check', 'sm', decorative=true) }} Сохранить</button>
            <a href="{{ url_for('admin.admin_testers') }}" class="neo-button ghost">{{ ui_icon('action.close', 'sm', decorative=true) }}Отмена</a>
        </div>
    </form>
</section>
{% endblock %}
