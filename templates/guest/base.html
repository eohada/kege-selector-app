<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}BooStudy Guest{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='katex.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='guest-workspace.css') }}">
</head>
<body class="guest-page {% block page_class %}{% endblock %}">
  <main class="guest-shell">{% block content %}{% endblock %}</main>
  <script>
  async function guestJson(url, options = {}) {
    const headers = {...(options.headers || {})};
    const csrf = document.querySelector('meta[name="csrf-token"]')?.content;
    if (csrf) headers['X-CSRFToken'] = csrf;
    if (!(options.body instanceof FormData) && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
    const response = await fetch(url, {...options, headers});
    const data = await response.json().catch(() => ({error: 'Сервер вернул некорректный ответ'}));
    if (!response.ok) throw new Error(data.error || 'Ошибка запроса');
    return data;
  }
  </script>
  <script src="{{ url_for('static', filename='guest-session-timer.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
