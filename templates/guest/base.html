<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>{% block title %}BooStudy Guest{% endblock %}</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#17233f;background:#f4f7fa}*{box-sizing:border-box}body{margin:0;padding:28px}.wrap{max-width:1100px;margin:auto}.card{background:#fff;border:2px solid #e0e7ef;border-radius:24px;box-shadow:0 4px 0 #d4dde8;padding:28px;margin-bottom:20px}.hero{background:linear-gradient(135deg,#4f46e5,#ec4899);color:#fff}.pill{display:inline-block;border-radius:999px;padding:7px 13px;background:#eef1ff;color:#4f46e5;font-weight:700;font-size:12px}.btn{border:0;border-bottom:4px solid #3730a3;border-radius:12px;background:#4f46e5;color:#fff;padding:12px 18px;font-weight:800;cursor:pointer}.btn.green{background:#05a878;border-color:#087553}.btn.ghost{background:#eef2f7;color:#273451;border-color:#cbd5e1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.task{border:2px solid #e2e8f0;border-radius:18px;padding:18px}.task textarea,.task input{width:100%;padding:12px;border:2px solid #dbe4ee;border-radius:12px;font:inherit}.task canvas{display:block;width:100%;height:auto;border:2px solid #dbe4ee;border-radius:12px;touch-action:none}.task label{display:block;padding:11px;background:#f5f8fb;border-radius:10px;margin:7px 0;cursor:pointer}.muted{color:#71819c}.error{color:#c0264d;font-weight:700}.success{color:#087553;font-weight:700}@media(max-width:700px){body{padding:12px}.card{padding:18px;border-radius:18px}}</style></head><body><main class="wrap">{% block content %}{% endblock %}</main><script>
async function guestJson(url, options={}){const headers={...(options.headers||{})};const csrf=document.querySelector('meta[name="csrf-token"]')?.content;if(csrf)headers['X-CSRFToken']=csrf;if(!(options.body instanceof FormData)&&!headers['Content-Type'])headers['Content-Type']='application/json';const response=await fetch(url,{...options,headers});const data=await response.json().catch(()=>({error:'Сервер вернул некорректный ответ'}));if(!response.ok)throw new Error(data.error||'Ошибка запроса');return data}
</script><script src="{{ url_for('static', filename='guest-session-timer.js') }}"></script>{% block scripts %}{% endblock %}</body></html>
