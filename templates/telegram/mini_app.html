{% extends "base_minimal.html" %}

{% block title %}BooStudy{% endblock %}

{% block head_extra %}
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --c-bg:       var(--tg-theme-bg-color, #f4f5f9);
    --c-surface:  var(--tg-theme-secondary-bg-color, #ffffff);
    --c-text:     var(--tg-theme-text-color, #1a1a2e);
    --c-hint:     var(--tg-theme-hint-color, #6b7280);
    --c-accent:   var(--tg-theme-button-color, #7b5cff);
    --c-accent-t: var(--tg-theme-button-text-color, #ffffff);
    --c-link:     var(--tg-theme-link-color, #7b5cff);
    --r-card:     16px;
    --r-btn:      12px;
    --shadow:     0 4px 20px rgba(0,0,0,.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--c-bg); color: var(--c-text); font-family: -apple-system, 'Golos Text', BlinkMacSystemFont, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

  /* Layout */
  #app { max-width: 480px; margin: 0 auto; padding: 12px 14px 90px; min-height: 100vh; }

  /* Header */
  .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .app-header .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
  .app-header .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c-accent); }
  .user-chip { background: var(--c-surface); border-radius: 999px; padding: 4px 12px 4px 8px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; box-shadow: var(--shadow); }
  .role-badge { font-size: 10px; background: var(--c-accent); color: var(--c-accent-t); border-radius: 999px; padding: 1px 7px; }

  /* Tab bar */
  .tab-bar { display: flex; background: var(--c-surface); border-radius: var(--r-card); padding: 4px; gap: 2px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .tab-btn { flex: 1; text-align: center; padding: 8px 4px; border-radius: 11px; border: none; background: none; cursor: pointer; font-size: 11px; font-weight: 600; color: var(--c-hint); transition: background .15s, color .15s; line-height: 1.3; }
  .tab-btn span.icon { display: block; font-size: 18px; line-height: 1; margin-bottom: 2px; }
  .tab-btn.active { background: var(--c-accent); color: var(--c-accent-t); }
  .tab-panel { display: none; animation: fadeUp .25s ease-out; }
  .tab-panel.active { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Cards */
  .card { background: var(--c-surface); border-radius: var(--r-card); padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 10px; }
  .card-title { font-size: 12px; font-weight: 700; color: var(--c-hint); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 10px; }
  .card-empty { text-align: center; padding: 24px 0; color: var(--c-hint); font-size: 13px; }

  /* Lesson row */
  .lesson-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,.06); }
  .lesson-row:last-child { border-bottom: none; padding-bottom: 0; }
  .lesson-time { font-size: 11px; font-weight: 700; color: var(--c-hint); min-width: 36px; padding-top: 2px; }
  .lesson-info { flex: 1; }
  .lesson-topic { font-weight: 600; font-size: 13px; line-height: 1.3; }
  .lesson-meta { font-size: 11px; color: var(--c-hint); margin-top: 2px; }
  .lesson-btn { flex-shrink: 0; background: var(--c-accent); color: var(--c-accent-t); border-radius: var(--r-btn); padding: 5px 10px; font-size: 11px; font-weight: 600; text-decoration: none; border: none; cursor: pointer; }

  /* Status pill */
  .pill { display: inline-flex; align-items: center; gap: 3px; border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 600; }
  .pill-pending  { background: #fef3c7; color: #92400e; }
  .pill-progress { background: #dbeafe; color: #1e40af; }
  .pill-returned { background: #fde8e8; color: #991b1b; }
  .pill-graded   { background: #d1fae5; color: #065f46; }
  .pill-auto     { background: #ede9fe; color: #5b21b6; }

  /* Assignment row */
  .assign-row { padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,.06); }
  .assign-row:last-child { border-bottom: none; padding-bottom: 0; }
  .assign-title { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .assign-meta  { font-size: 11px; color: var(--c-hint); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* Progress bars */
  .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .stat-label { font-size: 12px; color: var(--c-hint); }
  .stat-val { font-size: 15px; font-weight: 700; }
  .pbar-wrap { height: 6px; background: rgba(0,0,0,.06); border-radius: 999px; overflow: hidden; margin-bottom: 12px; }
  .pbar-fill  { height: 100%; border-radius: 999px; background: var(--c-accent); transition: width .5s; }

  /* Gradebook */
  .gb-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,.06); }
  .gb-row:last-child { border-bottom: none; }
  .gb-title { font-size: 12px; color: var(--c-text); flex: 1; margin-right: 8px; }
  .gb-score { font-weight: 700; font-size: 14px; }

  /* Toggle switch */
  .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,.06); }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-label { font-size: 13px; }
  .toggle-switch { position: relative; width: 42px; height: 24px; cursor: pointer; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-track { position: absolute; inset: 0; background: #d1d5db; border-radius: 999px; transition: background .2s; }
  .toggle-switch input:checked + .toggle-track { background: var(--c-accent); }
  .toggle-thumb { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .toggle-switch input:checked ~ .toggle-thumb { left: 21px; }

  /* Student table (creator) */
  .student-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,.06); }
  .student-row:last-child { border-bottom: none; }
  .student-name { font-weight: 600; font-size: 13px; }
  .student-meta  { font-size: 11px; color: var(--c-hint); margin-top: 1px; }
  .tg-badge { font-size: 11px; color: #059669; font-weight: 600; }
  .tg-badge-no { font-size: 11px; color: var(--c-hint); }

  /* Bug report */
  .report-row { padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,.06); }
  .report-row:last-child { border-bottom: none; }
  .report-meta { font-size: 11px; color: var(--c-hint); margin-bottom: 4px; display: flex; gap: 8px; }
  .report-msg  { font-size: 12px; line-height: 1.4; color: var(--c-text); margin-bottom: 6px; }
  .btn-reply { background: var(--c-accent); color: var(--c-accent-t); border: none; border-radius: var(--r-btn); padding: 5px 14px; font-size: 11px; font-weight: 600; cursor: pointer; }
  .btn-sm { background: var(--c-surface); border: 1.5px solid var(--c-accent); color: var(--c-accent); border-radius: var(--r-btn); padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--c-accent); color: var(--c-accent-t); border: none; border-radius: var(--r-btn); padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; text-align: center; }

  /* Broadcast compose */
  textarea { width: 100%; background: var(--c-bg); border: 1.5px solid rgba(0,0,0,.1); border-radius: var(--r-btn); padding: 10px 12px; font-size: 13px; resize: vertical; min-height: 90px; color: var(--c-text); }
  textarea:focus { outline: none; border-color: var(--c-accent); }

  /* Stats grid */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-card { background: var(--c-surface); border-radius: var(--r-card); padding: 12px 14px; box-shadow: var(--shadow); }
  .stat-card .val { font-size: 24px; font-weight: 800; color: var(--c-accent); }
  .stat-card .lbl { font-size: 11px; color: var(--c-hint); margin-top: 2px; }

  /* Search */
  .search-wrap { position: relative; margin-bottom: 10px; }
  .search-wrap input { width: 100%; background: var(--c-surface); border: none; border-radius: var(--r-btn); padding: 9px 12px 9px 36px; font-size: 13px; color: var(--c-text); box-shadow: var(--shadow); }
  .search-wrap input:focus { outline: none; }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--c-hint); font-size: 15px; }

  /* Loading */
  #loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 10px; }
  .spinner { width: 32px; height: 32px; border: 3px solid rgba(0,0,0,.1); border-top-color: var(--c-accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error screen */
  #error-screen { display: none; text-align: center; padding: 40px 16px; }
  #error-screen h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  #error-screen p { font-size: 13px; color: var(--c-hint); }

  /* Reply modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal-sheet { background: var(--c-surface); border-radius: 20px 20px 0 0; padding: 20px 16px 28px; width: 100%; max-width: 480px; }
  .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn-cancel { flex: 1; background: var(--c-bg); color: var(--c-hint); border: none; border-radius: var(--r-btn); padding: 11px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-send { flex: 2; background: var(--c-accent); color: var(--c-accent-t); border: none; border-radius: var(--r-btn); padding: 11px; font-size: 13px; font-weight: 700; cursor: pointer; }

  /* Filter tabs (mini) */
  .filter-row { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }
  .filter-btn { flex-shrink: 0; border: 1.5px solid rgba(0,0,0,.1); background: none; border-radius: 999px; padding: 4px 12px; font-size: 11px; font-weight: 600; color: var(--c-hint); cursor: pointer; }
  .filter-btn.active { border-color: var(--c-accent); color: var(--c-accent); background: rgba(123,92,255,.07); }

  /* Toast */
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1a1a2e; color: #fff; padding: 9px 20px; border-radius: 999px; font-size: 13px; font-weight: 600; transition: transform .3s; z-index: 200; pointer-events: none; }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
{% endblock %}

{% block body_class %}{% endblock %}

{% block body %}
<div id="app" style="display:none">

  <!-- HEADER -->
  <div class="app-header">
    <div class="logo">
      <div class="logo-dot"></div>
      BooStudy
    </div>
    <div class="user-chip">
      <span id="user-name-chip" style="max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</span>
      <span id="role-badge" class="role-badge" style="display:none"></span>
    </div>
  </div>

  <!-- STUDENT TABS -->
  <div id="student-tabs" style="display:none">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="schedule" onclick="switchTab('schedule','student-tabs')">
        <span class="icon">📅</span>Расписание
      </button>
      <button class="tab-btn" data-tab="tasks" onclick="switchTab('tasks','student-tabs')">
        <span class="icon">📚</span>Задания
      </button>
      <button class="tab-btn" data-tab="progress" onclick="switchTab('progress','student-tabs')">
        <span class="icon">📊</span>Прогресс
      </button>
      <button class="tab-btn" data-tab="profile" onclick="switchTab('profile','student-tabs')">
        <span class="icon">👤</span>Профиль
      </button>
    </div>

    <!-- Расписание -->
    <div id="tab-schedule" class="tab-panel active"></div>

    <!-- Задания -->
    <div id="tab-tasks" class="tab-panel">
      <div class="filter-row">
        <button class="filter-btn active" onclick="loadAssignments('pending',this)">Активные</button>
        <button class="filter-btn" onclick="loadAssignments('graded',this)">Проверенные</button>
        <button class="filter-btn" onclick="loadAssignments(null,this)">Все</button>
      </div>
      <div id="tasks-content"></div>
    </div>

    <!-- Прогресс -->
    <div id="tab-progress" class="tab-panel"></div>

    <!-- Профиль -->
    <div id="tab-profile" class="tab-panel"></div>
  </div>

  <!-- CREATOR TABS -->
  <div id="creator-tabs" style="display:none">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="c-students" onclick="switchTab('c-students','creator-tabs')">
        <span class="icon">👥</span>Ученики
      </button>
      <button class="tab-btn" data-tab="c-broadcast" onclick="switchTab('c-broadcast','creator-tabs')">
        <span class="icon">📢</span>Рассылка
      </button>
      <button class="tab-btn" data-tab="c-bugs" onclick="switchTab('c-bugs','creator-tabs')">
        <span class="icon">🐛</span>Репорты
      </button>
      <button class="tab-btn" data-tab="c-stats" onclick="switchTab('c-stats','creator-tabs')">
        <span class="icon">📊</span>Статистика
      </button>
    </div>

    <div id="tab-c-students" class="tab-panel active"></div>
    <div id="tab-c-broadcast" class="tab-panel"></div>
    <div id="tab-c-bugs" class="tab-panel"></div>
    <div id="tab-c-stats" class="tab-panel"></div>
  </div>

</div>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <p style="font-size:13px;color:var(--c-hint)">Загрузка…</p>
</div>

<!-- ERROR -->
<div id="error-screen">
  <h2>⚠️ Ошибка</h2>
  <p id="error-msg">Не удалось загрузить данные.</p>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- REPLY MODAL -->
<div id="reply-modal" class="modal-overlay" onclick="closeModal(event)">
  <div class="modal-sheet">
    <div class="modal-title">💬 Ответ на репорт</div>
    <textarea id="reply-text" placeholder="Введи ответ ученику…" rows="4"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn-send" onclick="sendReply()">Отправить</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const initData = tg?.initData || '';
let _currentUser = null;
let _isCreator = false;
let _replyReportId = null;

// ──────────────────────────────────────────────
// Bootstrap
// ──────────────────────────────────────────────
async function boot() {
  try {
    const dash = await api('/tg-app/api/dashboard', {});
    _currentUser = dash.user;
    _isCreator = dash.creator_mode || false;

    document.getElementById('user-name-chip').textContent =
      (dash.user?.name || 'Пользователь').split(' ')[0];

    const badge = document.getElementById('role-badge');
    if (_isCreator) { badge.textContent = 'Создатель'; badge.style.display = ''; }
    else if (['tutor','content_maker'].includes(dash.user?.role)) {
      badge.textContent = 'Учитель'; badge.style.display = '';
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = '';

    if (_isCreator) {
      document.getElementById('creator-tabs').style.display = '';
      document.getElementById('student-tabs').style.display = 'none';
      loadCreatorStudents();
    } else {
      document.getElementById('student-tabs').style.display = '';
      document.getElementById('creator-tabs').style.display = 'none';
      renderSchedule(dash.schedule || []);
      loadProgress();
    }
  } catch(e) {
    showError('Не удалось подключиться к BooStudy. Попробуй позже.');
  }
}

// ──────────────────────────────────────────────
// API helper
// ──────────────────────────────────────────────
async function api(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ init_data: initData, ...body }),
  });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

// ──────────────────────────────────────────────
// Tabs
// ──────────────────────────────────────────────
function switchTab(tabId, groupId) {
  const group = document.getElementById(groupId);
  group.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  group.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('tab-' + tabId);
  if (panel) {
    panel.classList.add('active');
    if (!panel.dataset.loaded) {
      panel.dataset.loaded = '1';
      if (tabId === 'tasks')      { /* handled by filter buttons */ }
      if (tabId === 'progress')   loadProgress();
      if (tabId === 'profile')    loadProfile();
      if (tabId === 'c-broadcast') loadBroadcasts();
      if (tabId === 'c-bugs')     loadBugReports('new');
      if (tabId === 'c-stats')    loadCreatorStats();
    }
  }
}

// ──────────────────────────────────────────────
// STUDENT — Расписание
// ──────────────────────────────────────────────
function renderSchedule(lessons) {
  const el = document.getElementById('tab-schedule');
  if (!lessons?.length) {
    el.innerHTML = `<div class="card"><div class="card-empty">📅 Ближайших уроков пока нет</div></div>`;
    return;
  }
  const rows = lessons.map(l => {
    const dt = l.starts_at || l.date;
    const dateObj = dt ? new Date(dt) : null;
    const timeStr = dateObj ? dateObj.toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'}) : '—';
    const dateStr = dateObj ? dateObj.toLocaleDateString('ru-RU', {day:'numeric',month:'short'}) : '—';
    const btnHtml = l.lesson_url
      ? `<a href="${l.lesson_url}" class="lesson-btn">Войти</a>` : '';
    const statusHtml = l.status === 'in_progress' ? '<span class="pill pill-progress">Идёт</span> ' : '';
    return `<div class="lesson-row">
      <div class="lesson-time">${timeStr}</div>
      <div class="lesson-info">
        <div class="lesson-topic">${statusHtml}${esc(l.topic || 'Урок')}</div>
        <div class="lesson-meta">${dateStr} · ${l.duration || 60} мин</div>
      </div>
      ${btnHtml}
    </div>`;
  }).join('');
  el.innerHTML = `<div class="card"><div class="card-title">Ближайшие уроки</div>${rows}</div>`;
}

// ──────────────────────────────────────────────
// STUDENT — Задания
// ──────────────────────────────────────────────
async function loadAssignments(filter, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const el = document.getElementById('tasks-content');
  el.innerHTML = '<div style="text-align:center;padding:24px;color:var(--c-hint)">Загрузка…</div>';
  try {
    const data = await api('/tg-app/api/assignments', { status_filter: filter });
    const subs = data.submissions || [];
    if (!subs.length) {
      el.innerHTML = '<div class="card"><div class="card-empty">✅ Заданий в этом разделе нет</div></div>';
      return;
    }
    const rows = subs.map(s => {
      const pill = pillHtml(s.status);
      const dl = s.deadline ? `<span>до ${fmtDate(s.deadline)}</span>` : '';
      const link = s.url ? `<a href="${s.url}" style="color:var(--c-link);font-size:11px">Открыть →</a>` : '';
      return `<div class="assign-row">
        <div class="assign-title">${esc(s.title)}</div>
        <div class="assign-meta">${pill} ${dl} ${link}</div>
      </div>`;
    }).join('');
    el.innerHTML = `<div class="card">${rows}</div>`;
  } catch(e) {
    el.innerHTML = '<div class="card"><div class="card-empty">⚠️ Ошибка загрузки</div></div>';
  }
}

// ──────────────────────────────────────────────
// STUDENT — Прогресс
// ──────────────────────────────────────────────
async function loadProgress() {
  const el = document.getElementById('tab-progress');
  el.innerHTML = '<div style="text-align:center;padding:24px;color:var(--c-hint)">Загрузка…</div>';
  try {
    const data = await api('/tg-app/api/progress', {});
    const subs = data.submissions || [];
    const gb = data.gradebook || [];
    const pending = data.pending_homework || 0;

    const graded = subs.filter(s => ['graded','submitted'].includes(s.status));
    const pct = graded.length ? Math.round(graded.filter(s => (s.percentage||0) >= 80).length / graded.length * 100) : null;

    let html = '';

    // Сводка
    html += `<div class="card">
      <div class="card-title">Сводка</div>
      <div class="stat-row"><span class="stat-label">📋 Активных заданий</span><span class="stat-val">${pending}</span></div>
      <div class="stat-row"><span class="stat-label">✅ Выполнено работ</span><span class="stat-val">${graded.length}</span></div>
      ${pct !== null ? `<div class="stat-row"><span class="stat-label">💪 Отлично (≥80%)</span><span class="stat-val">${pct}%</span></div>` : ''}
    </div>`;

    // Последние оценки
    if (gb.length) {
      const rows = gb.map(g => {
        const scoreColor = g.score >= 80 ? '#059669' : g.score >= 60 ? '#d97706' : '#dc2626';
        const barW = Math.min(100, Math.max(0, g.score || 0));
        return `<div class="gb-row">
          <div class="gb-title">${esc(g.title)}</div>
          <div class="gb-score" style="color:${scoreColor}">${g.score !== null ? g.score + '%' : '—'}</div>
        </div>
        <div class="pbar-wrap"><div class="pbar-fill" style="width:${barW}%;background:${scoreColor}"></div></div>`;
      }).join('');
      html += `<div class="card"><div class="card-title">Последние работы</div>${rows}</div>`;
    }

    el.innerHTML = html || '<div class="card"><div class="card-empty">📊 Пока нет данных для прогресса</div></div>';
  } catch(e) {
    el.innerHTML = '<div class="card"><div class="card-empty">⚠️ Ошибка загрузки</div></div>';
  }
}

// ──────────────────────────────────────────────
// STUDENT — Профиль
// ──────────────────────────────────────────────
async function loadProfile() {
  const el = document.getElementById('tab-profile');
  el.innerHTML = '<div style="text-align:center;padding:24px;color:var(--c-hint)">Загрузка…</div>';
  try {
    const [profData, notifData] = await Promise.all([
      api('/tg-app/api/profile', {}),
      api('/tg-app/api/profile/notifications', {}),
    ]);
    const p = profData.profile || {};
    const n = notifData.notifications || {};

    const sub = p.subscription;
    const subHtml = sub
      ? `<div style="font-size:12px;color:${sub.status === 'active' ? '#059669' : '#dc2626'}">
          ${sub.status === 'active' ? '✅ Подписка активна' : '⚠️ ' + sub.status}
          ${sub.ends_at ? ' · до ' + fmtDate(sub.ends_at) : ''}
        </div>`
      : `<div style="font-size:12px;color:var(--c-hint)">Подписка не найдена</div>`;

    const notifRows = [
      { key: 'tg_notify_homework_checked',      label: 'Проверка ДЗ' },
      { key: 'tg_notify_homework_returned',     label: 'ДЗ на доработку' },
      { key: 'tg_notify_lesson_scheduled',      label: 'Расписание уроков' },
      { key: 'tg_notify_lesson_reminder',       label: 'Напоминания (30 мин)' },
      { key: 'tg_notify_news',                  label: 'Новости и рассылки' },
      { key: 'tg_notify_daily_digest',          label: 'Утренний дайджест' },
      { key: 'tg_notify_subscription_expiring', label: 'Напоминание о подписке' },
    ].map(({ key, label }) => {
      const checked = n[key] !== false ? 'checked' : '';
      return `<div class="toggle-row">
        <span class="toggle-label">${label}</span>
        <label class="toggle-switch" onchange="toggleNotif('${key}',this)">
          <input type="checkbox" ${checked}>
          <span class="toggle-track"></span>
          <span class="toggle-thumb"></span>
        </label>
      </div>`;
    }).join('');

    const unlinkUrl = p.unlink?.profile_url || '#';

    el.innerHTML = `
      <div class="card">
        <div class="card-title">Профиль</div>
        <div style="font-size:16px;font-weight:700;margin-bottom:4px">${esc(p.name || p.username || '—')}</div>
        ${p.email ? `<div style="font-size:12px;color:var(--c-hint)">${esc(p.email)}</div>` : ''}
        <div style="margin-top:8px">${subHtml}</div>
      </div>
      <div class="card">
        <div class="card-title">Уведомления</div>
        <div class="toggle-row">
          <span class="toggle-label" style="font-weight:700">Все уведомления</span>
          <label class="toggle-switch" onchange="toggleNotif('telegram_notifications_enabled',this)">
            <input type="checkbox" ${n.telegram_notifications_enabled !== false ? 'checked' : ''}>
            <span class="toggle-track"></span>
            <span class="toggle-thumb"></span>
          </label>
        </div>
        ${notifRows}
      </div>
      <div class="card" style="text-align:center">
        <a href="${unlinkUrl}" style="color:var(--c-hint);font-size:13px;text-decoration:none">Отвязать Telegram-аккаунт →</a>
      </div>`;
  } catch(e) {
    el.innerHTML = '<div class="card"><div class="card-empty">⚠️ Ошибка загрузки профиля</div></div>';
  }
}

async function toggleNotif(key, label) {
  const val = label.querySelector('input').checked;
  try {
    await api('/tg-app/api/profile/notifications', { updates: { [key]: val } });
    showToast(val ? '✅ Включено' : '🔕 Выключено');
  } catch(e) {
    showToast('⚠️ Ошибка сохранения');
  }
}

// ──────────────────────────────────────────────
// CREATOR — Ученики
// ──────────────────────────────────────────────
async function loadCreatorStudents() {
  const el = document.getElementById('tab-c-students');
  el.innerHTML = `
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="student-search" type="search" placeholder="Поиск по имени…" oninput="filterStudents(this.value)">
    </div>
    <div id="students-list"><div style="text-align:center;padding:24px;color:var(--c-hint)">Загрузка…</div></div>`;

  try {
    const data = await api('/tg-app/api/creator/students', {});
    window._studentsData = data.students || [];
    renderStudents(window._studentsData);
  } catch(e) {
    document.getElementById('students-list').innerHTML = '<div class="card"><div class="card-empty">⚠️ Ошибка загрузки</div></div>';
  }
}

function filterStudents(q) {
  const filtered = (window._studentsData || []).filter(s =>
    (s.name || '').toLowerCase().includes(q.toLowerCase())
  );
  renderStudents(filtered);
}

function renderStudents(list) {
  const el = document.getElementById('students-list');
  if (!list.length) { el.innerHTML = '<div class="card"><div class="card-empty">Нет учеников</div></div>'; return; }
  const rows = list.map(s => {
    const tgHtml = s.telegram_linked
      ? `<span class="tg-badge">📱 В боте</span>`
      : `<span class="tg-badge-no">Не привязан</span>`;
    const lastStr = s.last_activity_at ? fmtDate(s.last_activity_at) : 'никогда';
    return `<div class="student-row">
      <div>
        <div class="student-name">${esc(s.name || '—')}</div>
        <div class="student-meta">Активность: ${lastStr}</div>
      </div>
      ${tgHtml}
    </div>`;
  }).join('');
  const total = (window._studentsData || []).length;
  el.innerHTML = `<div class="card"><div class="card-title">Учеников: ${total}</div>${rows}</div>`;
}

// ──────────────────────────────────────────────
// CREATOR — Рассылка
// ──────────────────────────────────────────────
async function loadBroadcasts() {
  const el = document.getElementById('tab-c-broadcast');
  el.innerHTML = `
    <div class="card">
      <div class="card-title">Новая рассылка</div>
      <textarea id="broadcast-text" placeholder="Текст рассылки…"></textarea>
      <div style="margin-top:10px">
        <input id="broadcast-photo" type="url" placeholder="URL картинки (опционально)" style="width:100%;background:var(--c-bg);border:1.5px solid rgba(0,0,0,.1);border-radius:var(--r-btn);padding:8px 12px;font-size:13px;color:var(--c-text)">
      </div>
      <button class="btn-primary" style="margin-top:10px" onclick="sendBroadcast()">📢 Отправить всем ученикам</button>
    </div>
    <div id="broadcasts-history"><div style="text-align:center;padding:16px;color:var(--c-hint)">Загрузка истории…</div></div>`;

  try {
    const data = await api('/tg-app/api/creator/broadcasts', {});
    const items = data.broadcasts || [];
    if (!items.length) {
      document.getElementById('broadcasts-history').innerHTML = '<div class="card"><div class="card-empty">Рассылок пока не было</div></div>';
      return;
    }
    const rows = items.map(b => {
      const statusColor = { completed:'#059669', running:'#d97706', failed:'#dc2626', pending:'#6b7280' }[b.status] || '#6b7280';
      return `<div class="assign-row">
        <div class="assign-title">${esc(b.message_preview)}${b.message_preview.length >= 100 ? '…' : ''}</div>
        <div class="assign-meta">
          <span style="color:${statusColor}">${b.status}</span>
          <span>${b.sent_ok} из ${b.total_planned}</span>
          <span>${fmtDate(b.created_at)}</span>
        </div>
      </div>`;
    }).join('');
    document.getElementById('broadcasts-history').innerHTML = `<div class="card"><div class="card-title">История рассылок</div>${rows}</div>`;
  } catch(e) {}
}

async function sendBroadcast() {
  const text = (document.getElementById('broadcast-text')?.value || '').trim();
  const photoUrl = (document.getElementById('broadcast-photo')?.value || '').trim();
  if (!text) { showToast('⚠️ Введи текст рассылки'); return; }
  try {
    const data = await api('/tg-app/api/broadcast/create', { message: text, photo_url: photoUrl || null });
    if (data.ok) {
      showToast('✅ Рассылка запущена!');
      document.getElementById('broadcast-text').value = '';
      document.getElementById('broadcast-photo').value = '';
      document.getElementById('tab-c-broadcast').dataset.loaded = '';
      loadBroadcasts();
    }
  } catch(e) { showToast('⚠️ Ошибка при создании рассылки'); }
}

// ──────────────────────────────────────────────
// CREATOR — Баг-репорты
// ──────────────────────────────────────────────
async function loadBugReports(statusFilter) {
  const el = document.getElementById('tab-c-bugs');
  const html = `
    <div class="filter-row">
      <button class="filter-btn active" onclick="reloadBugReports('new',this)">Новые</button>
      <button class="filter-btn" onclick="reloadBugReports('answered',this)">Отвечены</button>
      <button class="filter-btn" onclick="reloadBugReports('all',this)">Все</button>
    </div>
    <div id="bugs-list"></div>`;
  el.innerHTML = html;
  await fetchAndRenderBugs(statusFilter || 'new');
}

async function reloadBugReports(filter, btn) {
  document.querySelectorAll('#tab-c-bugs .filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  await fetchAndRenderBugs(filter);
}

async function fetchAndRenderBugs(filter) {
  const el = document.getElementById('bugs-list');
  el.innerHTML = '<div style="text-align:center;padding:16px;color:var(--c-hint)">Загрузка…</div>';
  try {
    const data = await api('/tg-app/api/creator/bug-reports', { status: filter });
    const reports = data.reports || [];
    if (!reports.length) {
      el.innerHTML = '<div class="card"><div class="card-empty">✅ Репортов в этом разделе нет</div></div>';
      return;
    }
    const rows = reports.map(r => {
      const statusLabel = { new:'🆕 Новый', in_progress:'🔄 В работе', answered:'✅ Отвечен', closed:'🔒 Закрыт' }[r.status] || r.status;
      const replyBtn = ['new','in_progress'].includes(r.status)
        ? `<button class="btn-reply" onclick="openReply(${r.report_id})">💬 Ответить</button>` : '';
      return `<div class="report-row">
        <div class="report-meta">
          <span><b>${esc(r.student_name)}</b></span>
          <span>${fmtDate(r.created_at)}</span>
          <span>${statusLabel}</span>
          ${r.has_screenshot ? '<span>📎 Скрин</span>' : ''}
        </div>
        <div class="report-msg">${esc(r.message)}</div>
        ${r.admin_reply ? `<div style="font-size:11px;color:#059669;margin-bottom:4px">💬 ${esc(r.admin_reply)}</div>` : ''}
        ${replyBtn}
      </div>`;
    }).join('');
    el.innerHTML = `<div class="card">${rows}</div>`;
  } catch(e) {
    el.innerHTML = '<div class="card"><div class="card-empty">⚠️ Ошибка загрузки</div></div>';
  }
}

function openReply(reportId) {
  _replyReportId = reportId;
  document.getElementById('reply-text').value = '';
  document.getElementById('reply-modal').classList.add('open');
}

function closeModal(e) {
  // Called either directly (no event) or on backdrop click
  if (!e || e.target === document.getElementById('reply-modal')) {
    document.getElementById('reply-modal').classList.remove('open');
  }
}

async function sendReply() {
  const text = (document.getElementById('reply-text').value || '').trim();
  if (!text) { showToast('⚠️ Введи текст ответа'); return; }
  try {
    const data = await api('/tg-app/api/creator/bug-reports/reply', {
      report_id: _replyReportId,
      reply: text,
    });
    if (data.ok) {
      closeModal();
      showToast('✅ Ответ отправлен ученику!');
      fetchAndRenderBugs('new');
    }
  } catch(e) { showToast('⚠️ Ошибка при отправке'); }
}

// ──────────────────────────────────────────────
// CREATOR — Статистика
// ──────────────────────────────────────────────
async function loadCreatorStats() {
  const el = document.getElementById('tab-c-stats');
  el.innerHTML = '<div style="text-align:center;padding:24px;color:var(--c-hint)">Загрузка…</div>';
  try {
    const data = await api('/tg-app/api/creator/stats', {});
    const s = data.stats || {};
    el.innerHTML = `
      <div class="stats-grid">
        ${statCard(s.total_users, 'Всего пользователей')}
        ${statCard(s.active_students, 'Активных учеников')}
        ${statCard(s.tg_linked, 'В боте')}
        ${statCard(s.lessons_today, 'Уроков сегодня')}
        ${statCard(s.pending_submissions, 'Ожидают проверки')}
        ${statCard(s.active_subscriptions, 'Подписок')}
        ${statCard(s.new_bug_reports, 'Новых репортов')}
        ${statCard(s.broadcasts_total, 'Рассылок')}
      </div>`;
  } catch(e) {
    el.innerHTML = '<div class="card"><div class="card-empty">⚠️ Ошибка загрузки</div></div>';
  }
}

function statCard(val, label) {
  return `<div class="stat-card"><div class="val">${val ?? '—'}</div><div class="lbl">${label}</div></div>`;
}

// ──────────────────────────────────────────────
// Helpers
// ──────────────────────────────────────────────
function pillHtml(status) {
  const map = {
    'ASSIGNED':     ['pill-pending',  '📝 Назначено'],
    'IN_PROGRESS':  ['pill-progress', '🔄 В процессе'],
    'RETURNED':     ['pill-returned', '↩️ Доработка'],
    'GRADED':       ['pill-graded',   '✅ Проверено'],
    'SUBMITTED':    ['pill-progress', '📤 Сдано'],
    'NEEDS_MANUAL_REVIEW': ['pill-progress', '🔍 Требует проверки'],
  };
  const [cls, txt] = map[status] || ['pill-pending', status];
  return `<span class="pill ${cls}">${txt}</span>`;
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined });
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  const err = document.getElementById('error-screen');
  err.style.display = '';
  document.getElementById('error-msg').textContent = msg;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ──────────────────────────────────────────────
// Start
// ──────────────────────────────────────────────
boot();
</script>
{% endblock %}
