
{% from '_ui_icon.html' import ui_icon %}

<button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Открыть меню">
    <span></span>
    <span></span>
    <span></span>
</button>

<div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>

<nav class="mobile-menu" id="mobileMenu">
    <div class="mobile-menu-header">
        <div class="nav-brand">
            <a href="{{ url_for('main.index') }}" style="text-decoration: none; display: flex; align-items: center;">
                <img src="{{ url_for('static', filename='icons/BooStudyLogo1-Photoroom.png') }}" alt="BooStudy Logo" class="brand-logo-img" style="height: 38px; width: auto; object-fit: contain;">
            </a>
        </div>
        <button class="mobile-menu-close" id="mobileMenuClose" aria-label="Закрыть меню">
            {{ ui_icon('action.close', 'md', decorative=true) }}
        </button>
    </div>
    <div class="mobile-nav-links">
        {% include '_nav_links_body.html' %}
    </div>
</nav>

<script>
    // Управление мобильным меню
    document.addEventListener('DOMContentLoaded', function() {
        const toggle = document.getElementById('mobileMenuToggle');
        const menu = document.getElementById('mobileMenu');
        const overlay = document.getElementById('mobileMenuOverlay');
        const close = document.getElementById('mobileMenuClose');

        function openMenu() {
            toggle.classList.add('active');
            menu.classList.add('active');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeMenu() {
            toggle.classList.remove('active');
            menu.classList.remove('active');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        if (toggle) toggle.addEventListener('click', openMenu);
        if (close) close.addEventListener('click', closeMenu);
        if (overlay) overlay.addEventListener('click', closeMenu);

        // Закрытие при клике на ссылку
        const mobileLinks = document.querySelectorAll('.mobile-menu .nav-link');
        mobileLinks.forEach(link => {
            link.addEventListener('click', function() {
                setTimeout(closeMenu, 300); // Небольшая задержка для плавности
            });
        });
    });
</script>
