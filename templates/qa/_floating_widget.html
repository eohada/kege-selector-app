<!-- Виджет имперсонации (красная плашка поверх QA-виджета) -->
<div id="impersonationWidget" style="
    position: fixed;
    bottom: 5rem;
    right: 1.25rem;
    background: #dc2626;
    color: #fff;
    padding: 0.5rem 1rem;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    z-index: 10002;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.8rem;
">
    <div style="display:flex;flex-direction:column;">
        <span style="font-size:0.65rem;opacity:0.8;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;">Имперсонация</span>
        <span>Ты под аккаунтом: <b>{{ current_user.username }}</b></span>
    </div>
    <form action="{{ url_for('qa.revert_impersonation') }}" method="POST" style="margin:0;padding:0;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" style="
            background: #991b1b;
            color: #fff;
            border: none;
            padding: 0.35rem 0.75rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        ">Вернуться</button>
    </form>
</div>
