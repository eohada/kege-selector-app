<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая задача · QA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='modern_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='toast.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% if csrf_token %}
    <meta name="csrf-token" content="{{ csrf_token() }}">
    {% endif %}
    <style>
        .app-content { padding: 20px; }
        /* Override bootstrap form styles to look better in dark mode if needed */
        .form-control {
            background-color: var(--surface-1);
            border-color: var(--stroke-1);
            color: var(--text-primary);
        }
        .form-control:focus {
            background-color: var(--surface-2);
            border-color: var(--accent-1);
            color: var(--text-primary);
            box-shadow: 0 0 0 0.25rem rgba(var(--accent-1-rgb), 0.25);
        }
        label { color: var(--text-primary); }
    </style>
</head>
<body>
    <div class="app-layout">
        {% set active_page = 'qa_board' %}
        {% include '_sidebar.html' %}
    <div class="app-main">
        {% include '_topbar.html' %}
        <main class="app-content">
        {% include '_ux_enhancements.html' %}

        <div class="container mt-4 glass-panel p-4" style="max-width: 800px;">
            <h2 class="mb-4" style="color: var(--text-primary);">Создать задачу</h2>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="title" class="form-label">Заголовок</label>
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Описание</label>
                    <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label for="context_url" class="form-label">URL контекста</label>
                    <input type="text" class="form-control" id="context_url" name="context_url" value="{{ request.args.get('context_url', '') }}">
                </div>
                <div class="mb-3">
                    <label for="target_user_id" class="form-label">ID пользователя</label>
                    <input type="text" class="form-control" id="target_user_id" name="target_user_id" value="{{ request.args.get('target_user_id', '') }}">
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="neo-button accent">Создать</button>
                    <a href="{{ url_for('qa.board') }}" class="neo-button ghost">Отмена</a>
                </div>
            </form>
        </div>

        </main>
    </div>
    </div>
</body>
</html>
