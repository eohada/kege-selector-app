
<div class="nav-actions flex items-center gap-4">
    {% if current_user.is_authenticated %}
    <div class="flex items-center gap-2 text-muted text-sm">
        <span>👤 {{ current_user.username }}</span>
    </div>
    <a href="{{ url_for('auth.logout') }}" class="neo-button ghost text-sm no-underline" style="padding: 0.5em 1em;">🚪 Выход</a>
    {% endif %}
</div>
