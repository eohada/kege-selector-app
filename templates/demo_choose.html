<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Демо · Вход</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='modern_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='toast.css') }}">
    {% if csrf_token %}
    <meta name="csrf-token" content="{{ csrf_token() }}">
    {% endif %}
    <style>
        .demo-choose-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .demo-choose-card {
            width: 100%;
            max-width: 420px;
        }
        .demo-choose-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .demo-code-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .demo-code-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.35rem;
        }
        .demo-code-input {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--stroke-1);
            background: var(--surface-1);
            color: var(--text-primary);
            font-size: 1rem;
            box-sizing: border-box;
        }
        .demo-code-input:focus {
            outline: none;
            border-color: var(--accent-1);
            box-shadow: 0 0 0 2px rgba(0, 255, 213, 0.15);
        }
        .demo-code-input.error {
            border-color: var(--danger, #e53935);
        }
        .demo-code-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: -0.25rem;
        }
        .demo-submit-btn {
            width: 100%;
            padding: 0.85rem 1.25rem;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            background: var(--surface-2);
            border: 1px solid var(--stroke-2);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        .demo-submit-btn:hover {
            background: var(--surface-3);
            border-color: var(--accent-1);
            box-shadow: 0 0 16px rgba(0, 255, 213, 0.12);
        }
        .demo-error-msg {
            font-size: 0.85rem;
            color: var(--danger, #e53935);
            margin-top: 0.5rem;
            display: none;
        }
        .demo-error-msg.visible {
            display: block;
        }
    </style>
    <script>
        (function(){
            try {
                var v = localStorage.getItem('ui.themeMode');
                if (v === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
                else if (v === 'light') document.documentElement.setAttribute('data-theme', 'light');
            } catch(e) {}
        })();
        document.addEventListener('DOMContentLoaded', function() {
            var form = document.getElementById('demo-code-form');
            var input = document.getElementById('demo-code');
            var errEl = document.getElementById('demo-code-error');
            var startUrl = '{{ url_for("auth.demo_start", exam="ege") }}';

            try {
                var params = new URLSearchParams(window.location.search);
                if (params.get('error') === 'invalid_code') {
                    if (errEl) { errEl.textContent = 'Неверный код. Попробуйте ещё раз.'; errEl.classList.add('visible'); }
                    if (input) input.classList.add('error');
                }
            } catch(e) {}

            if (form && input) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    if (errEl) errEl.classList.remove('visible');
                    input.classList.remove('error');
                    var code = (input.value || '').trim();
                    if (!code) {
                        input.classList.add('error');
                        if (errEl) { errEl.textContent = 'Введите код для входа в демо.'; errEl.classList.add('visible'); }
                        return;
                    }
                    // Передаём введённый код на сервер, он сам решает: это реферальный или общий код.
                    var url = startUrl + (startUrl.indexOf('?') !== -1 ? '&' : '?') + 'code=' + encodeURIComponent(code);
                    window.location.href = url;
                });
            }
        });
    </script>
</head>
<body>
    <div class="demo-choose-container">
        <div class="demo-choose-card">
            <section class="glass-panel">
                <div class="demo-choose-header">
                    <p class="hero-eyebrow">демонстрация</p>
                    <h1 class="hero-title">Вход в демо-тур</h1>
                    <p class="hero-subtitle">Введите код для запуска короткого тура по платформе</p>
                </div>
                <form id="demo-code-form" class="demo-code-form" action="{{ url_for('auth.demo_start', exam='ege') }}" method="get">
                    <div>
                        <label for="demo-code" class="demo-code-label">Код доступа</label>
                        <input type="text" id="demo-code" name="code" placeholder="Введите код" autocomplete="off" required class="demo-code-input">
                        <p class="demo-code-hint">Обязательное поле. Без правильного кода демо не запустится.</p>
                        <p id="demo-code-error" class="demo-error-msg" role="alert"></p>
                    </div>
                    <button type="submit" class="demo-submit-btn">Начать демо</button>
                </form>
            </section>
        </div>
    </div>
</body>
</html>
