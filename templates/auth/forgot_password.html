{% extends 'base_minimal.html' %}

{% block title %}Восстановление пароля · BooStudy{% endblock %}

{% block content %}
<div class="w-full mx-auto" style="max-width: 480px;">
    <section class="glass-panel">
        <div class="text-center mb-3">
            <p class="hero-eyebrow">пароль</p>
            <h1 class="hero-title">Восстановление</h1>
            <p class="hero-subtitle">Введите ваш логин или почту для сброса пароля</p>
        </div>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            {% if csrf_token %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}

            <div class="neo-field">
                <label class="neo-label">Логин или Email</label>
                <input class="neo-input" name="username_or_email" placeholder="Введите логин или почту" required autofocus>
            </div>

            <div>
                <button type="submit" class="neo-button accent w-full">Получить код восстановления</button>
            </div>

            <div class="mt-5 pt-5 border-t border-stroke text-center">
                <a href="{{ url_for('auth.login') }}" class="neo-button ghost w-full justify-center">Вернуться ко входу</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
