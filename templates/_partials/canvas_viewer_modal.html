{# Canvas Viewer Modal — преподаватель просматривает заметки ученика поверх условия #}
<div id="boo-canvas-viewer-modal" class="hidden" style="display:none; position:fixed; inset:0; z-index:10000;">
  <div style="position:absolute; inset:0; background:rgba(0,0,0,0.5);" onclick="BooCanvasViewer.close()"></div>
  <div style="position:relative; margin:2vh auto; width:94vw; max-width:1180px; height:94vh;
              background:var(--color-bg-surface, #fff); border-radius:20px;
              display:flex; flex-direction:column; overflow:hidden;
              box-shadow:0 24px 64px rgba(0,0,0,0.18); z-index:1;">
    <div style="display:flex; align-items:center; gap:0.75rem; padding:1rem 1.25rem; border-bottom:1px solid var(--stroke-1, #e2e8f0);">
      <i class="ph-bold ph-pencil-line" style="font-size:1.25rem; color:var(--accent-1, #6366f1);"></i>
      <span id="cv-title" style="font-weight:700; font-size:1rem; flex:1;">Заметки ученика</span>
      <div id="cv-zoom-controls" style="display:flex; align-items:center; gap:.4rem;">
        <button type="button" id="cv-zoom-out" class="neo-button ghost sm" style="padding:.25rem .5rem;">-</button>
        <span id="cv-zoom-label" style="min-width:56px; text-align:center; font-size:.8rem; color:var(--text-muted); font-weight:700;">100%</span>
        <button type="button" id="cv-zoom-in" class="neo-button ghost sm" style="padding:.25rem .5rem;">+</button>
        <button type="button" id="cv-zoom-reset" class="neo-button ghost sm" style="padding:.25rem .5rem;">1:1</button>
      </div>
      <span id="cv-updated" style="font-size:0.8rem; color:var(--text-muted);"></span>
      <button onclick="BooCanvasViewer.close()" style="background:none; border:none; cursor:pointer; padding:0.25rem; color:var(--text-muted, #94a3b8);">
        <i class="ph-bold ph-x" style="font-size:1.25rem;"></i>
      </button>
    </div>
    <div id="cv-loader" style="flex:1; display:flex; align-items:center; justify-content:center;">
      <span style="color:var(--text-muted); font-size:0.95rem;">Загрузка...</span>
    </div>
    <div id="cv-stage-wrap" style="flex:1; overflow:auto; display:none; background:var(--surface-2,#f8fafc);">
      <div id="cv-stage" style="position:relative; margin:0 auto; padding:1.25rem; min-width:max-content;">
        <div id="cv-zoom-layer" style="position:relative; transform-origin: top left;">
          <div id="cv-task-snapshot" class="task-content" style="background:var(--color-bg-surface,#fff); border:1px solid var(--stroke-1,#e2e8f0); border-radius:16px; padding:1rem;"></div>
          <canvas id="cv-overlay-canvas" style="position:absolute; pointer-events:none;"></canvas>
        </div>
      </div>
    </div>
    <div id="cv-empty" style="flex:1; display:none; align-items:center; justify-content:center;">
      <span style="color:var(--text-muted); font-size:0.95rem;">Ученик не оставил заметок для этого задания.</span>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var modal = document.getElementById('boo-canvas-viewer-modal');
  var loader = document.getElementById('cv-loader');
  var stageWrap = document.getElementById('cv-stage-wrap');
  var stage = document.getElementById('cv-stage');
  var zoomLayer = document.getElementById('cv-zoom-layer');
  var snapshotEl = document.getElementById('cv-task-snapshot');
  var canvas = document.getElementById('cv-overlay-canvas');
  var emptyEl = document.getElementById('cv-empty');
  var updatedEl = document.getElementById('cv-updated');
  var zoomLabel = document.getElementById('cv-zoom-label');
  var zoomOutBtn = document.getElementById('cv-zoom-out');
  var zoomInBtn = document.getElementById('cv-zoom-in');
  var zoomResetBtn = document.getElementById('cv-zoom-reset');
  var lastStrokes = null;
  var renderBaseWidth = null;
  var renderBaseHeight = null;
  var triggerBaseWidth = null;
  var triggerBaseHeight = null;
  var currentZoom = 1;
  var resizeTimer = null;

  function show() {
    modal.classList.remove('hidden');
    modal.style.display = '';
    document.body.style.overflow = 'hidden';
    if (snapshotEl) snapshotEl.style.width = '';
  }
  function hide() {
    modal.classList.add('hidden');
    modal.style.display = 'none';
    document.body.style.overflow = '';
    lastStrokes = null;
    renderBaseWidth = null;
    renderBaseHeight = null;
    triggerBaseWidth = null;
    triggerBaseHeight = null;
  }

  function collectTopLevelBlocks(card, selector) {
    if (!card) return [];
    var nodes = Array.prototype.slice.call(card.querySelectorAll(selector));
    if (!nodes.length) return [];
    return nodes.filter(function(node) {
      if (node.closest('.task-content, .task-content-grade') === node) {
        // keep only root-most content blocks to avoid duplicated nested wrappers
        var p = node.parentElement;
        while (p && p !== card) {
          if (p.matches && p.matches('.task-content, .task-content-grade')) return false;
          p = p.parentElement;
        }
        return true;
      }
      return false;
    });
  }

  function buildSnapshotFromTrigger(triggerEl) {
    if (!snapshotEl) return false;
    snapshotEl.innerHTML = '';
    if (!triggerEl || !triggerEl.closest) return false;
    var card = triggerEl.closest('.task-card, .task-card-grade');
    if (!card) return false;
    var blocks = collectTopLevelBlocks(card, '.task-content, .task-content-grade');
    if (!blocks || !blocks.length) return false;
    var firstRect = blocks[0].getBoundingClientRect ? blocks[0].getBoundingClientRect() : null;
    if (firstRect) {
      triggerBaseWidth = Math.max(firstRect.width || 0, 1);
      triggerBaseHeight = Math.max(firstRect.height || 0, 1);
    } else {
      triggerBaseWidth = null;
      triggerBaseHeight = null;
    }
    blocks.forEach(function(node) {
      var clone = node.cloneNode(true);
      snapshotEl.appendChild(clone);
    });
    return true;
  }

  function toNumber(v) {
    var n = Number(v);
    return Number.isFinite(n) ? n : null;
  }

  function renderStrokes(strokes) {
    if (!canvas || !snapshotEl || !stage) return;
    lastStrokes = Array.isArray(strokes) ? strokes : [];
    var preferredWidth = renderBaseWidth || triggerBaseWidth || 0;
    var contentWidth = Math.max(preferredWidth, snapshotEl.scrollWidth, snapshotEl.clientWidth, 1);
    var preferredHeight = renderBaseHeight || triggerBaseHeight || 0;
    var contentHeight = Math.max(snapshotEl.scrollHeight, snapshotEl.clientHeight, preferredHeight || 0, 1);
    var renderSpaceWidth = Math.max(renderBaseWidth || triggerBaseWidth || contentWidth, 1);
    var renderSpaceHeight = Math.max(renderBaseHeight || triggerBaseHeight || contentHeight, 1);
    var dpr = window.devicePixelRatio || 1;

    var left = snapshotEl.offsetLeft;
    var top = snapshotEl.offsetTop;
    canvas.style.left = left + 'px';
    canvas.style.top = top + 'px';
    canvas.style.width = contentWidth + 'px';
    canvas.style.height = contentHeight + 'px';
    canvas.width = Math.floor(contentWidth * dpr);
    canvas.height = Math.floor(contentHeight * dpr);

    var ctx = canvas.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    function pointToLocal(point, stroke) {
      var rx = toNumber(point && point.rx);
      var ry = toNumber(point && point.ry);
      if (rx !== null && ry !== null) {
        return { x: rx * renderSpaceWidth, y: ry * renderSpaceHeight };
      }
      var sx = toNumber(point && point.x);
      var sy = toNumber(point && point.y);
      var space = stroke && stroke.space ? stroke.space : null;
      if (space && sx !== null && sy !== null) {
        var sw = toNumber(space.width) || contentWidth;
        var sh = toNumber(space.height) || contentHeight;
        var sl = toNumber(space.left) || 0;
        var st = toNumber(space.top) || 0;
        return {
          x: (sx - sl) * (contentWidth / Math.max(sw, 1)),
          y: (sy - st) * (contentHeight / Math.max(sh, 1)),
        };
      }
      return { x: sx || 0, y: sy || 0 };
    }

    lastStrokes.forEach(function(s) {
      if (!s.points || !s.points.length) return;
      ctx.save();
      if (s.eraser) {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.strokeStyle = 'rgba(0,0,0,1)';
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = s.color || '#ef4444';
      }
      ctx.lineWidth = s.width || 3;
      ctx.beginPath();
      s.points.forEach(function(p, i) {
        var pt = pointToLocal(p, s);
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      ctx.stroke();
      ctx.restore();
    });
    applyZoom();
  }

  function applyZoom() {
    if (!zoomLayer || !snapshotEl || !canvas || !stage) return;
    zoomLayer.style.transform = 'scale(' + currentZoom + ')';
    var baseW = Math.max(snapshotEl.offsetWidth || 1, 1);
    var baseH = Math.max(snapshotEl.offsetHeight || 1, 1);
    var scaledW = Math.max(Math.ceil(baseW * currentZoom), 1);
    var scaledH = Math.max(Math.ceil(baseH * currentZoom), 1);
    stage.style.width = scaledW + 'px';
    stage.style.height = scaledH + 'px';
    if (zoomLabel) {
      zoomLabel.textContent = Math.round(currentZoom * 100) + '%';
    }
  }

  function clampZoom(v) {
    return Math.min(3.5, Math.max(0.35, v));
  }

  window.BooCanvasViewer = {
    async open(studentUserId, taskId, contextType, contextId, triggerEl) {
      show();
      loader.style.display = 'flex';
      stageWrap.style.display = 'none';
      emptyEl.style.display = 'none';
      updatedEl.textContent = '';

      buildSnapshotFromTrigger(triggerEl);
      renderBaseWidth = null;
      renderBaseHeight = null;
      triggerBaseWidth = null;
      triggerBaseHeight = null;
      currentZoom = 1;

      try {
        var params = new URLSearchParams({ task_id: taskId, context_type: contextType || 'submission' });
        if (contextId) params.set('context_id', contextId);
        var res = await fetch('/api/canvas/view/' + studentUserId + '?' + params.toString(), {
          credentials: 'same-origin',
          headers: { 'X-Requested-With': 'XMLHttpRequest' },
        });
        var data = await res.json();
        loader.style.display = 'none';

        if (data.success && data.exists) {
          var strokes = typeof data.strokes === 'string' ? JSON.parse(data.strokes) : data.strokes;
          if (Array.isArray(strokes) && strokes.length > 0) {
            var refStroke = strokes.find(function(s) {
              return s && s.space && Number.isFinite(Number(s.space.width)) && Number.isFinite(Number(s.space.height));
            });
            if (refStroke && refStroke.space) {
              renderBaseWidth = Number(refStroke.space.width) || null;
              renderBaseHeight = Number(refStroke.space.height) || null;
            }
            if (renderBaseWidth || triggerBaseWidth) {
              snapshotEl.style.width = Math.max(320, Math.round(renderBaseWidth || triggerBaseWidth || 320)) + 'px';
            } else {
              snapshotEl.style.width = '';
            }
            stageWrap.style.display = '';
            if (data.updated_at) {
              updatedEl.textContent = 'Обновлено: ' + new Date(data.updated_at).toLocaleString('ru-RU');
            }
            requestAnimationFrame(function() { renderStrokes(strokes); });
            return;
          }
        }
        emptyEl.style.display = 'flex';
      } catch (e) {
        loader.style.display = 'none';
        emptyEl.style.display = 'flex';
        var span = emptyEl.querySelector('span');
        if (span) span.textContent = 'Ошибка загрузки заметок.';
      }
    },
    close: hide,
  };

  window.addEventListener('resize', function() {
    if (!modal || modal.style.display === 'none') return;
    var hasCanvas = stageWrap && stageWrap.style.display !== 'none';
    if (!hasCanvas) return;
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      if (Array.isArray(lastStrokes) && lastStrokes.length) {
        renderStrokes(lastStrokes);
      } else {
        applyZoom();
      }
    }, 80);
  });

  if (zoomOutBtn) {
    zoomOutBtn.addEventListener('click', function() {
      currentZoom = clampZoom(currentZoom - 0.15);
      applyZoom();
    });
  }
  if (zoomInBtn) {
    zoomInBtn.addEventListener('click', function() {
      currentZoom = clampZoom(currentZoom + 0.15);
      applyZoom();
    });
  }
  if (zoomResetBtn) {
    zoomResetBtn.addEventListener('click', function() {
      currentZoom = 1;
      applyZoom();
    });
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') hide();
  });
})();
</script>
