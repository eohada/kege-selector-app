

<div id="tasks-container">
    
</div>

<section class="border-2 border-dashed border-slate-200 dark:border-dark-avatar rounded-xl p-6 text-center mt-3 transition-all hover:bg-slate-50/50 dark:hover:bg-white/[0.01]">
    <button type="button" onclick="addTaskCard()" class="px-4 py-3.5 bg-surface dark:bg-dark-card text-boo-primary dark:text-purple-300 border border-purple-200 dark:border-dark-avatar rounded-xl font-bold hover:bg-purple-50 dark:hover:bg-white/[0.04] transition-all flex items-center justify-center gap-1.5 w-full cursor-pointer text-sm">
        <i class="ph-bold ph-plus text-base"></i>Добавить еще задание
    </button>
</section>

<template id="task-card-template">
    <section class="bg-surface-alt dark:bg-white/[0.02] border border-slate-200 dark:border-dark-light rounded-xl p-6 mb-3 relative hover:shadow-md transition-all duration-300 task-card-entry">
        <button type="button" onclick="removeTaskCard(this)" class="absolute top-4 right-4 p-2.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 dark:text-rose-400 rounded-xl transition-all border-0 cursor-pointer flex items-center justify-center" title="Удалить задание">
            <i class="ph-bold ph-trash text-base"></i>
        </button>
        
        <div class="mb-5 max-w-xs">
            <label class="block mb-2 text-tiny font-extrabold text-muted dark:text-dark-muted uppercase tracking-widest">Номер задания (ЕГЭ)</label>
            <input type="number" class="task-number-input w-full bg-surface dark:bg-dark-card border border-slate-200 dark:border-dark-avatar rounded-xl px-4 py-2.5 font-semibold text-secondary dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-boo-primary focus:ring-2 focus:ring-purple-500/20 transition-all text-sm" min="{{ (task_numbers|first) if task_numbers else 1 }}" max="{{ (task_numbers|last) if task_numbers else 27 }}" value="{{ (task_numbers|first) if task_numbers else 1 }}">
        </div>

        <div class="mb-5">
            <label class="block mb-2 text-tiny font-extrabold text-muted dark:text-dark-muted uppercase tracking-widest">Текст задания</label>
            <textarea class="task-content-input w-full bg-surface dark:bg-dark-card border border-slate-200 dark:border-dark-avatar rounded-xl px-4 py-3 font-semibold text-secondary dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-boo-primary focus:ring-2 focus:ring-purple-500/20 transition-all text-sm" rows="6" placeholder="Введите текст задания..." style="font-family: inherit;"></textarea>
            <small class="text-xs text-muted dark:text-dark-muted font-bold mt-1 block">Поддерживается HTML-разметка</small>
        </div>

        <div>
            <label class="block mb-2 text-tiny font-extrabold text-muted dark:text-dark-muted uppercase tracking-widest">Правильный ответ</label>
            <input type="text" class="task-answer-input w-full bg-surface dark:bg-dark-card border border-slate-200 dark:border-dark-avatar rounded-xl px-4 py-2.5 font-semibold text-secondary dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-boo-primary focus:ring-2 focus:ring-purple-500/20 transition-all text-sm" placeholder="Например: 42">
        </div>
    </section>
</template>

<script>
    function addTaskCard() {
        const template = document.getElementById('task-card-template');
        const clone = template.content.cloneNode(true);
        document.getElementById('tasks-container').appendChild(clone);
        updateCount();
    }

    function removeTaskCard(btn) {
        btn.closest('.task-card-entry').remove();
        updateCount();
    }

    function updateCount() {
        const count = document.querySelectorAll('.task-card-entry').length;
        const el = document.getElementById('tasks-count');
        if (el) el.textContent = count;
    }

    document.addEventListener('DOMContentLoaded', () => {
        addTaskCard();
    });
</script>
