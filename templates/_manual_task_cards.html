

<div id="tasks-container">
    
</div>

<section class="glass-panel text-center mt-8" style="border-style: dashed;">
    <button type="button" onclick="addTaskCard()" class="neo-button outline w-full" style="padding: 1.5rem;">
        {{ ui_icon('action.plus', 'sm', decorative=true) }}Добавить еще задание
    </button>
</section>

<template id="task-card-template">
    <section class="glass-panel task-card-entry mb-6 relative">
        <button type="button" onclick="removeTaskCard(this)" class="neo-button danger absolute top-4 right-4" style="padding: 0.5rem;">
            {{ ui_icon('action.trash', 'sm', decorative=true, extra_class='ui-icon--only') }}
        </button>
        
        <div class="form-group mb-6" style="max-width: 200px;">
            <label class="block mb-2 font-semibold">Номер задания (ЕГЭ)</label>
            <input type="number" class="task-number-input neo-input w-full" min="{{ (task_numbers|first) if task_numbers else 1 }}" max="{{ (task_numbers|last) if task_numbers else 27 }}" value="{{ (task_numbers|first) if task_numbers else 1 }}">
        </div>

        <div class="form-group mb-6">
            <label class="block mb-2 font-semibold">Текст задания</label>
            <textarea class="task-content-input neo-input w-full" rows="6" placeholder="Введите текст задания..." style="font-family: inherit;"></textarea>
            <small class="text-muted">Поддерживается HTML-разметка</small>
        </div>

        <div class="form-group">
            <label class="block mb-2 font-semibold">Правильный ответ</label>
            <input type="text" class="task-answer-input neo-input w-full" placeholder="Например: 42">
        </div>
    </section>
</template>

<script>
    function addTaskCard() {
        const template = document.getElementById('task-card-template');
        const clone = template.content.cloneNode(true);
        document.getElementById('tasks-container').appendChild(clone);
        updateCount();
    }

    function removeTaskCard(btn) {
        btn.closest('.task-card-entry').remove();
        updateCount();
    }

    function updateCount() {
        const count = document.querySelectorAll('.task-card-entry').length;
        const el = document.getElementById('tasks-count');
        if (el) el.textContent = count;
    }

    document.addEventListener('DOMContentLoaded', () => {
        addTaskCard();
    });
</script>
