<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание BooStudy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #F8FAFC; color: #0F172A; font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-display { font-family: 'Golos Text', sans-serif; }
        .bento-card {
            background-color: #F4F7FA;
            border: 2px solid #E2E8F0;
            box-shadow: 0 4px 0 #DAE1E9;
            border-radius: 1.5rem;
        }
        .bento-btn {
            border-bottom: 4px solid #0284C7;
            box-shadow: 0 4px 10px rgba(14, 165, 233, 0.2);
            transition: all 0.15s ease;
        }
        .bento-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen">
    <!-- Header -->
    <div class="bento-card p-5 mb-4 flex items-center justify-between">
        <div>
            <span class="text-xs font-bold uppercase tracking-wider text-sky-600 bg-sky-100 px-2.5 py-1 rounded-full">BooStudy TMA</span>
            <h1 class="text-xl font-display font-black text-slate-900 mt-1">🗓️ Моё Расписание</h1>
        </div>
        <div class="w-10 h-10 rounded-2xl bg-sky-500 text-white flex items-center justify-between justify-center font-bold shadow-[0_3px_0_#0284C7]">
            📅
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast" class="hidden fixed top-4 left-4 right-4 z-50 bg-slate-900 text-white p-3 rounded-2xl shadow-xl text-xs font-medium text-center"></div>

    <!-- Lessons List Container -->
    <div id="lessons-list" class="space-y-3">
        <div class="bento-card p-4 animate-pulse flex items-center justify-between">
            <div class="h-4 bg-slate-200 rounded w-2/3"></div>
            <div class="h-8 bg-slate-200 rounded w-1/4"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        function showToast(msg) {
            if (tg && tg.showPopup) {
                tg.showPopup({ title: "BooStudy", message: msg, buttons: [{ type: "ok" }] });
                return;
            }
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        async function loadSchedule() {
            try {
                const initData = tg?.initData || 'test_mock';
                const resp = await fetch('/api/tma/schedule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData })
                });
                const data = await resp.json();
                
                if (!data.ok) {
                    showToast(data.error || 'Ошибка загрузки');
                    return;
                }

                const container = document.getElementById('lessons-list');
                if (!data.lessons || data.lessons.length === 0) {
                    container.innerHTML = `<div class="bento-card p-6 text-center text-slate-500 text-sm">Занятий не найдено</div>`;
                    return;
                }

                container.innerHTML = data.lessons.map(l => `
                    <div class="bento-card p-4 flex flex-col gap-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-xs font-bold text-slate-500">${l.date}</span>
                                <h3 class="font-bold text-slate-900 text-sm mt-0.5">${l.title}</h3>
                            </div>
                            <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">Запланировано</span>
                        </div>
                        <a href="${l.room_url}" class="bento-btn bg-sky-500 hover:bg-sky-600 text-white font-bold text-xs py-2 px-4 rounded-xl text-center">
                            🚀 Войти в урок
                        </a>
                    </div>
                `).join('');

            } catch (err) {
                showToast('Ошибка подключения к серверу');
            }
        }

        document.addEventListener('DOMContentLoaded', loadSchedule);
    </script>
</body>
</html>
