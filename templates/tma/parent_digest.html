<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дайджест Родителя BooStudy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #F8FAFC; color: #0F172A; font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-display { font-family: 'Golos Text', sans-serif; }
        .bento-card {
            background-color: #F4F7FA;
            border: 2px solid #E2E8F0;
            box-shadow: 0 4px 0 #DAE1E9;
            border-radius: 1.5rem;
        }
        .bento-btn-emerald {
            border-bottom: 4px solid #059669;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
            transition: all 0.15s ease;
        }
        .bento-btn-emerald:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen">
    <!-- Header -->
    <div class="bento-card p-5 mb-4 flex items-center justify-between">
        <div>
            <span class="text-xs font-bold uppercase tracking-wider text-emerald-600 bg-emerald-100 px-2.5 py-1 rounded-full">Родительский Кабинет</span>
            <h1 class="text-xl font-display font-black text-slate-900 mt-1">📈 Дайджест Успеваемости</h1>
        </div>
        <div class="w-10 h-10 rounded-2xl bg-emerald-500 text-white flex items-center justify-center font-bold shadow-[0_3px_0_#059669]">
            📊
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast" class="hidden fixed top-4 left-4 right-4 z-50 bg-slate-900 text-white p-3 rounded-2xl shadow-xl text-xs font-medium text-center"></div>

    <!-- Digest Card -->
    <div id="digest-container" class="space-y-3">
        <div class="bento-card p-4 animate-pulse flex items-center justify-between">
            <div class="h-4 bg-slate-200 rounded w-2/3"></div>
            <div class="h-8 bg-slate-200 rounded w-1/4"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        function showToast(msg) {
            if (tg && tg.showPopup) {
                tg.showPopup({ title: "BooStudy Parent", message: msg, buttons: [{ type: "ok" }] });
                return;
            }
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        async function loadDigest() {
            try {
                const initData = tg?.initData || 'test_mock';
                const resp = await fetch('/api/tma/parent/digest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData })
                });
                const data = await resp.json();
                
                if (!data.ok) {
                    showToast(data.error || 'Ошибка загрузки');
                    return;
                }

                const d = data.digest;
                const container = document.getElementById('digest-container');
                container.innerHTML = `
                    <div class="bento-card p-5 space-y-4">
                        <div class="flex items-center justify-between pb-3 border-b border-slate-200">
                            <span class="text-xs text-slate-500 font-bold">Ученик</span>
                            <span class="text-sm font-bold text-slate-900">${d.student_name}</span>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-white p-3 rounded-2xl border border-slate-200 text-center">
                                <span class="text-[10px] text-slate-400 font-extrabold uppercase">Посещаемость</span>
                                <div class="text-lg font-black text-emerald-600 mt-0.5">${d.attendance_percent}%</div>
                            </div>
                            <div class="bg-white p-3 rounded-2xl border border-slate-200 text-center">
                                <span class="text-[10px] text-slate-400 font-extrabold uppercase">Средний балл</span>
                                <div class="text-lg font-black text-sky-600 mt-0.5">${d.average_score}</div>
                            </div>
                        </div>

                        <div class="bg-emerald-50 border border-emerald-200 p-3.5 rounded-2xl flex items-center justify-between">
                            <div>
                                <div class="text-xs font-bold text-emerald-900">Баланс занятий</div>
                                <div class="text-xs text-emerald-700">Осталось ${d.lessons_balance} уроков</div>
                            </div>
                            <span class="text-xs font-extrabold px-2.5 py-1 bg-emerald-500 text-white rounded-xl shadow-[0_2px_0_#059669]">${d.subscription_status}</span>
                        </div>
                    </div>
                `;

            } catch (err) {
                showToast('Ошибка подключения к серверу');
            }
        }

        document.addEventListener('DOMContentLoaded', loadDigest);
    </script>
</body>
</html>
