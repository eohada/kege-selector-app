# Blue-Green production example.
#
# Copy to docker-compose.bluegreen.yml on the server and adapt env_file/volumes.
# The host nginx proxies to 127.0.0.1:8001 or 127.0.0.1:8002.
#
# PostgreSQL stays the source of truth. Redis is used for live workspace snapshots,
# Socket.IO message queue/cache, Celery broker/result backend.

x-web-common: &web-common
  build: .
  restart: unless-stopped
  volumes:
    - ./uploads:/app/uploads
  env_file:
    - .env
  environment:
    ENVIRONMENT: production
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    EVENTLET_NO_GREENDNS: "yes"
  command: >
    env EVENTLET_NO_GREENDNS=yes
    gunicorn wsgi:app
    --worker-class eventlet
    -w 1
    --bind 0.0.0.0:8000
    --timeout 180
    --keep-alive 5
    --graceful-timeout 30
  depends_on:
    - redis
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).read()\""
      ]
    interval: 10s
    timeout: 6s
    retries: 12
    start_period: 20s

services:
  web_blue:
    <<: *web-common
    container_name: boostudy_web_blue
    ports:
      - "127.0.0.1:8001:8000"

  web_green:
    <<: *web-common
    container_name: boostudy_web_green
    ports:
      - "127.0.0.1:8002:8000"

  # Keep exactly one beat process active. Start/restart these after the web switch.
  celery-worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A celery_app.celery worker --loglevel=info --concurrency=2
    depends_on:
      - redis

  celery-beat:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A celery_app.celery beat --loglevel=info
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  redis_data:
