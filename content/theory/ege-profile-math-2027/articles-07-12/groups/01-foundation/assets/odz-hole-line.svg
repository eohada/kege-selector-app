<svg xmlns="http://www.w3.org/2000/svg" width="900" height="397" viewBox="0 0 900 397" role="img" aria-label="Сокращённое выражение может иметь выколотую точку"><rect x="0" y="0" width="900" height="397" rx="24" fill="#F7F9FE" stroke="#F7F9FE" stroke-width="0"/><text x="33" y="43" fill="#20304E" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">Сокращённое выражение может иметь выколотую точку</text><rect x="46" y="80" width="806" height="288" rx="15" fill="#FFFFFF" stroke="#BAC6D9" stroke-width="1.5"/><line x1="120" y1="302" x2="775" y2="302" stroke="#63748F" stroke-width="2" stroke-linecap="round"/><line x1="330" y1="319" x2="330" y2="109" stroke="#63748F" stroke-width="2" stroke-linecap="round"/><path d="M 120 300 L 750 115" stroke="#586BF0" fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="540" cy="177" r="11" fill="#FFFFFF" stroke="#E96970" stroke-width="4"/><text x="562" y="164" fill="#E96970" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">x = 5 — точка исключена</text><text x="112" y="345" fill="#20304E" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start">Прямая y = x + 5 без одной точки: x ≠ 5</text></svg>