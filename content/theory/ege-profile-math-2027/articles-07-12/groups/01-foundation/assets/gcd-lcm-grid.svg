<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Для НОД берём минимум, для НОК максимум"><rect x="0" y="0" width="900" height="380" rx="24" fill="#F7F9FE" stroke="#F7F9FE" stroke-width="0"/><text x="33" y="43" fill="#20304E" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">Для НОД берём минимум, для НОК максимум</text><rect x="54" y="78" width="792" height="270" rx="15" fill="#FFFFFF" stroke="#BAC6D9" stroke-width="1.5"/><rect x="82" y="105" width="232" height="208" rx="15" fill="#E8ECFF" stroke="#BAC6D9" stroke-width="1.5"/><text x="198" y="135" fill="#20304E" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Простое число 2</text><text x="198" y="169" fill="#20304E" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">360: степень 3</text><text x="198" y="199" fill="#20304E" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">120: степень 2</text><text x="198" y="242" fill="#0C9C8D" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">НОД: min = 2</text><text x="198" y="270" fill="#586BF0" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">НОК: max = 3</text><rect x="342" y="105" width="232" height="208" rx="15" fill="#E5F7F2" stroke="#BAC6D9" stroke-width="1.5"/><text x="458" y="135" fill="#20304E" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Простое число 3</text><text x="458" y="169" fill="#20304E" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">360: степень 2</text><text x="458" y="199" fill="#20304E" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">120: степень 1</text><text x="458" y="242" fill="#0C9C8D" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">НОД: min = 1</text><text x="458" y="270" fill="#586BF0" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">НОК: max = 2</text><rect x="602" y="105" width="232" height="208" rx="15" fill="#FFF3D9" stroke="#BAC6D9" stroke-width="1.5"/><text x="718" y="135" fill="#20304E" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Простое число 5</text><text x="718" y="169" fill="#20304E" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">360: степень 1</text><text x="718" y="199" fill="#20304E" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle">120: степень 1</text><text x="718" y="242" fill="#0C9C8D" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">НОД: min = 1</text><text x="718" y="270" fill="#586BF0" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">НОК: max = 1</text><text x="450" y="337" fill="#20304E" font-family="Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle">НОД = 120; НОК = 360 (для пары 360 и 120)</text></svg>