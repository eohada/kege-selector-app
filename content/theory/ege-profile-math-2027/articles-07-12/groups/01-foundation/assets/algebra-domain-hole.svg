<svg xmlns="http://www.w3.org/2000/svg" width="900" height="385" viewBox="0 0 900 385" role="img" aria-label="Сокращение не возвращает запрещённую точку"><rect x="0" y="0" width="900" height="385" rx="24" fill="#F7F9FE" stroke="#F7F9FE" stroke-width="0"/><text x="33" y="43" fill="#20304E" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">Сокращение не возвращает запрещённую точку</text><rect x="48" y="80" width="804" height="262" rx="15" fill="#FFFFFF" stroke="#BAC6D9" stroke-width="1.5"/><text x="90" y="130" fill="#586BF0" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">Исходная дробь</text><text x="90" y="167" fill="#20304E" font-family="Arial,sans-serif" font-size="24" font-weight="600" text-anchor="start">(x² − 9)/(x − 3)</text><text x="90" y="210" fill="#E96970" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">x ≠ 3</text><path d="M 400 165 L 490 165 M 476 154 L 490 165 L 476 176" stroke="#586BF0" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="530" y="130" fill="#0C9C8D" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start">После сокращения</text><text x="530" y="167" fill="#20304E" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start">x + 3</text><text x="530" y="210" fill="#E96970" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">при x ≠ 3</text><text x="450" y="290" fill="#20304E" font-family="Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle">Ограничение сохраняется после упрощения</text></svg>