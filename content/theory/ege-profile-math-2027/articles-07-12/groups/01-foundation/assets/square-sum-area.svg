<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-label="Квадрат суммы как четыре точные площади"><rect x="0" y="0" width="900" height="490" rx="24" fill="#F7F9FE" stroke="#F7F9FE" stroke-width="0"/><text x="33" y="43" fill="#20304E" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">Квадрат суммы как четыре точные площади</text><rect x="50" y="79" width="800" height="355" rx="15" fill="#FFFFFF" stroke="#BAC6D9" stroke-width="1.5"/><rect x="252" y="100" width="320" height="320" rx="0" fill="#E8ECFF" stroke="#586BF0" stroke-width="3"/><rect x="252" y="100" width="200" height="200" rx="0" fill="#E5F7F2" stroke="#0C9C8D" stroke-width="1"/><rect x="452" y="300" width="120" height="120" rx="0" fill="#FFF3D9" stroke="#E8A72F" stroke-width="1"/><line x1="452" y1="100" x2="452" y2="420" stroke="#586BF0" stroke-width="2" stroke-linecap="round"/><line x1="252" y1="300" x2="572" y2="300" stroke="#586BF0" stroke-width="2" stroke-linecap="round"/><text x="352" y="206" fill="#20304E" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle">a²</text><text x="512" y="206" fill="#20304E" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">ab</text><text x="352" y="365" fill="#20304E" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">ab</text><text x="512" y="365" fill="#20304E" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">b²</text><text x="422" y="452" fill="#20304E" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">(a+b)² = a² + 2ab + b²</text></svg>