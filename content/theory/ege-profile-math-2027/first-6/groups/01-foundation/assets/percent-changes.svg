<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-label="Процентные изменения применяются последовательно">
<rect x="0" y="0" width="900" height="370" rx="24" fill="#F7F9FE"/>
<text x="32" y="40" fill="#243251" font-size="22" font-weight="700" font-family="Arial, sans-serif">Процентные изменения применяются последовательно</text>
<text x="180" y="98" font-size="18" fill="#243251" font-family="Arial, sans-serif" text-anchor="middle">Исходно</text>
<rect x="110" y="137" width="160" height="140" rx="10" fill="#FFFFFF" stroke="#D1DBEA" stroke-width="1"/>
<rect x="110" y="167.0" width="160" height="110.00000000000001" rx="6" fill="#587DF7" stroke="none" stroke-width="0"/>
<text x="190" y="303" font-size="25" fill="#587DF7" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold">100</text>
<text x="440" y="98" font-size="18" fill="#243251" font-family="Arial, sans-serif" text-anchor="middle">После +20%</text>
<rect x="370" y="137" width="160" height="140" rx="10" fill="#FFFFFF" stroke="#D1DBEA" stroke-width="1"/>
<rect x="370" y="145.0" width="160" height="132.0" rx="6" fill="#17A398" stroke="none" stroke-width="0"/>
<text x="450" y="303" font-size="25" fill="#17A398" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold">120</text>
<text x="700" y="98" font-size="18" fill="#243251" font-family="Arial, sans-serif" text-anchor="middle">После −25%</text>
<rect x="630" y="137" width="160" height="140" rx="10" fill="#FFFFFF" stroke="#D1DBEA" stroke-width="1"/>
<rect x="630" y="178.0" width="160" height="99.00000000000001" rx="6" fill="#E47477" stroke="none" stroke-width="0"/>
<text x="710" y="303" font-size="25" fill="#E47477" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold">90</text>
<text x="450" y="352" font-size="22" fill="#243251" font-family="Arial, sans-serif" text-anchor="middle">100 × 1,20 × 0,75 = 90</text>
</svg>