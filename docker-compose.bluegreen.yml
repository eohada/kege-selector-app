# Canonical blue-green web stack for production.
# PostgreSQL and Redis are owned by the primary compose stack; this file joins
# its existing Docker network and never creates a second data store.

x-web-common: &web-common
  build: .
  restart: unless-stopped
  env_file:
    - .env
  environment:
    ENVIRONMENT: production
    EVENTLET_NO_GREENDNS: "yes"
  volumes:
    - ./uploads:/app/uploads
  command: >
    env EVENTLET_NO_GREENDNS=yes
    gunicorn wsgi:app
    --worker-class eventlet
    --workers 1
    --bind 0.0.0.0:8000
    --timeout 180
    --keep-alive 5
    --graceful-timeout 30
  healthcheck:
    test:
      ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).read()\""]
    interval: 10s
    timeout: 6s
    retries: 12
    start_period: 20s

services:
  web_blue:
    <<: *web-common
    container_name: boostudy_web_blue
    ports:
      - "127.0.0.1:8001:8000"

  web_green:
    <<: *web-common
    container_name: boostudy_web_green
    ports:
      - "127.0.0.1:8002:8000"

networks:
  default:
    name: boostudy_default
    external: true
