# Пример конфигурации для деплоя на сервере.
# Скопируй в docker-compose.yml и адаптируй под свои сервисы.
#
# ВАЖНО для бота: должен работать только ОДИН экземпляр.
# Иначе будет Conflict: terminated by other getUpdates request.

services:
  web:
    build: .
    command: gunicorn ...
    # ...

  bot:
    build: .
    command: python urep_bot/run_bot.py
    env_file: .env
    depends_on:
      - db
    # Критично: одна реплика!
    deploy:
      replicas: 1

  db:
    image: postgres:15
    # ...
