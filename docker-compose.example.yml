# Пример конфигурации для деплоя на сервере.
# Скопируй в docker-compose.yml и адаптируй под свои сервисы.
#
# Песочница Python (запуск кода ученика, модуль turtle):
# В образе веб-сервиса: xvfb, python3-tk, ghostscript (Debian:
# apt-get install -y xvfb python3-tk ghostscript
#). xvfb-run в PATH; gs — рисунок turtle (PS→PNG) в «Вывод» на странице.
#
# Telegram-бот BooStudy работает через WEBHOOK внутри сервиса web
# (POST /webhook/telegram). Отдельный контейнер bot/bot_prod НЕ нужен.
# См. DEPLOY_TELEGRAM_WEBHOOK.md

services:
  web:
    build: .
    volumes:
      - ./uploads:/app/uploads
    command: env EVENTLET_NO_GREENDNS=yes gunicorn wsgi:app --worker-class eventlet -w 1 --bind 0.0.0.0:8000 --timeout 180 --keep-alive 5
    # env_file: .env — те же BOT_TOKEN, APP_URL, BOT_INTERNAL_TOKEN, что и раньше
    # ...

  db:
    image: postgres:15
    # ...

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  celery-worker:
    build: .
    volumes:
      - ./uploads:/app/uploads
    command: celery -A celery_app.celery worker --loglevel=info --concurrency=2
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - web
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A celery_app.celery beat --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - web
    restart: unless-stopped

volumes:
  minio_data:
  redis_data:
