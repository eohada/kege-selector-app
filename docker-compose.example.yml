# Пример конфигурации для деплоя на сервере.
# Скопируй в docker-compose.yml и адаптируй под свои сервисы.
#
# ВАЖНО для бота: должен работать только ОДИН экземпляр.
# Иначе будет Conflict: terminated by other getUpdates request.

services:
  web:
    build: .
    command: gunicorn ...
    # ...

  bot:
    build: .
    command: python urep_bot/run_bot.py
    env_file: .env
    depends_on:
      - db
    # Критично: одна реплика!
    deploy:
      replicas: 1

  db:
    image: postgres:15
    # ...

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  celery-worker:
    build: .
    command: celery -A celery_app.celery worker --loglevel=info --concurrency=2
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - web
    restart: unless-stopped

volumes:
  minio_data:
  redis_data:
