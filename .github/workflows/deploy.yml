name: Deploy to VPS (MANUAL PROD)

on:
  workflow_dispatch:
    inputs:
      import_math_foundation:
        description: Import the validated EGE mathematics foundation package as drafts after deployment
        required: false
        type: boolean
        default: false

concurrency:
  group: boostudy-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HOST: ${{ secrets.HOST }}
      USERNAME: ${{ secrets.USERNAME }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

    steps:
      - name: Validate deployment access secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST}" || { echo "::error::Secret HOST is not set"; exit 1; }
          test -n "${USERNAME}" || { echo "::error::Secret USERNAME is not set"; exit 1; }
          test -n "${SSH_PRIVATE_KEY}" || { echo "::error::Secret SSH_PRIVATE_KEY is not set"; exit 1; }
          test -n "${SSH_KNOWN_HOSTS}" || { echo "::error::Secret SSH_KNOWN_HOSTS is not set"; exit 1; }
          case "${SSH_PORT}" in
            ''|*[!0-9]*) echo "::error::SSH_PORT must be numeric"; exit 1 ;;
          esac

      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python for theory package validation
        if: ${{ inputs.import_math_foundation }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node for KaTeX validation
        if: ${{ inputs.import_math_foundation }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install theory package validation dependencies
        if: ${{ inputs.import_math_foundation }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci --ignore-scripts

      - name: Validate math foundation packages
        if: ${{ inputs.import_math_foundation }}
        id: validate_math_packages
        shell: bash
        run: |
          set -euo pipefail

          validate_package() {
            local package_path="$1"
            local output_name="$2"
            local report digest
            report="$(BOOSTUDY_SKIP_DATABASE_BOOTSTRAP=1 BOOSTUDY_BACKGROUND_WORKERS_ENABLED=0 \
              python scripts/import_theory_math.py --package "$package_path" --mode validate)"
            printf '%s\n' "$report" | python -c '
          import json, re, sys
          result = json.load(sys.stdin)
          validation = result.get("validation", {})
          if validation.get("valid") is not True or validation.get("latex_checked") is not True or validation.get("issues") != []:
              raise SystemExit("Math package must validate with valid=true, latex_checked=true, issues=[]")
          digest = validation.get("package_sha256", "")
          if not re.fullmatch(r"[a-f0-9]{64}", digest):
              raise SystemExit("Validator did not return a package SHA-256")
          print("validated:", validation.get("course_slug"), validation.get("articles"), "articles,", validation.get("assets"), "assets")
          '
            digest="$(printf '%s\n' "$report" | python -c 'import json,sys; print(json.load(sys.stdin)["validation"]["package_sha256"])')"
            printf '%s=%s\n' "$output_name" "$digest" >> "$GITHUB_OUTPUT"
          }

          validate_package content/theory/ege-profile-math-2027/first-6 first6_sha256
          validate_package content/theory/ege-profile-math-2027/articles-07-12 articles_07_12_sha256

      - name: Deploy with blue-green helper
        shell: bash
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          IMPORT_MATH_FOUNDATION: ${{ inputs.import_math_foundation }}
          FIRST6_PACKAGE_SHA256: ${{ steps.validate_math_packages.outputs.first6_sha256 }}
          ARTICLES_07_12_PACKAGE_SHA256: ${{ steps.validate_math_packages.outputs.articles_07_12_sha256 }}
        run: |
          set -euo pipefail
          [[ "${DEPLOY_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]]
          if [[ "${IMPORT_MATH_FOUNDATION}" == "true" ]]; then
            [[ "${FIRST6_PACKAGE_SHA256}" =~ ^[a-f0-9]{64}$ ]]
            [[ "${ARTICLES_07_12_PACKAGE_SHA256}" =~ ^[a-f0-9]{64}$ ]]
          fi

          REMOTE_COMMAND="BRANCH='${DEPLOY_BRANCH}' sudo -n --preserve-env=BRANCH /opt/boostudy/scripts/deploy_blue_green.sh deploy"
          if [[ "${IMPORT_MATH_FOUNDATION}" == "true" ]]; then
            REMOTE_COMMAND="printf '%s\\n%s\\n' '${FIRST6_PACKAGE_SHA256}' '${ARTICLES_07_12_PACKAGE_SHA256}' | ${REMOTE_COMMAND}"
          fi

          KEY_FILE="$(mktemp)"
          KNOWN_HOSTS="$(mktemp)"
          umask 077
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${KEY_FILE}"
          trap 'rm -f "${KEY_FILE}" "${KNOWN_HOSTS}"' EXIT

          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${KNOWN_HOSTS}"
          cat "${GITHUB_WORKSPACE}/.github/boostudy_known_hosts" >> "${KNOWN_HOSTS}"

          for attempt in 1 2 3; do
            echo "SSH deploy attempt ${attempt}/3"
            if ssh -4 -i "${KEY_FILE}" -p "${SSH_PORT}" \
              -o BatchMode=yes \
              -o UserKnownHostsFile="${KNOWN_HOSTS}" \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=25 \
              -o ServerAliveCountMax=8 \
              "${USERNAME}@${HOST}" \
              "${REMOTE_COMMAND}"; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep 30
            fi
          done
          echo "::error::Blue-green deploy failed after 3 SSH attempts"
          exit 1

      - name: Public production smoke check
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://boostudy.ru/ready >/tmp/boostudy-ready.json
          curl --fail --silent --show-error --max-time 20 https://boostudy.ru/health >/tmp/boostudy-health.json
          cat /tmp/boostudy-ready.json
          cat /tmp/boostudy-health.json
