name: Deploy Sandbox (AUTO)

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and update sandbox
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Drone SSH parses these as Go durations and requires a unit (e.g. 120s, 20m).
          # Bare numbers like 120 fail with: missing unit in duration "120".
          timeout: 120s
          command_timeout: 20m
          script: |
            /opt/boostudy/deploy_sandbox.sh