name: Deploy Sandbox (AUTO)

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and update sandbox
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # The deploy step failed with: "dial tcp ...:22: i/o timeout".
          # appleboy/ssh-action expects these values in seconds (numbers), not duration strings.
          timeout: 120
          command_timeout: 1200
          script: |
            /opt/boostudy/deploy_sandbox.sh